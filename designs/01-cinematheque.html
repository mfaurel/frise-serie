<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design 1 — Cinémathèque</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-primary: #0a0a0f;
    --bg-surface: #14141f;
    --bg-elevated: #1e1e2e;
    --text-primary: #e8e6e3;
    --text-secondary: #8a8891;
    --text-accent: #c9a96e;
    --border-subtle: rgba(255,255,255,0.06);
    --border-hover: rgba(255,255,255,0.12);
    --focus-ring: #6366f1;
  }

  html { -webkit-font-smoothing: antialiased; }

  body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: 'DM Sans', system-ui, sans-serif;
    overflow: hidden;
    height: 100vh;
  }

  /* ── NAV ── */
  .nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 56px;
    background: rgba(10,10,15,0.75);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    padding: 0 24px;
    z-index: 100;
    gap: 32px;
  }

  .nav-logo {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700;
    font-size: 18px;
    color: var(--text-accent);
    letter-spacing: 0.5px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .nav-eras {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    flex: 1;
  }
  .nav-eras::-webkit-scrollbar { display: none; }

  .era-pill {
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    cursor: pointer;
    border: 1px solid var(--border-subtle);
    color: var(--text-secondary);
    transition: all 200ms cubic-bezier(0.2,0,0,1);
    background: transparent;
  }
  .era-pill:hover, .era-pill.active {
    color: var(--text-accent);
    border-color: var(--text-accent);
    background: rgba(201,169,110,0.08);
  }

  .nav-actions {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-shrink: 0;
  }

  .nav-btn {
    padding: 6px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid var(--border-subtle);
    color: var(--text-secondary);
    background: transparent;
    font-family: inherit;
    transition: all 150ms;
  }
  .nav-btn:hover { color: var(--text-primary); border-color: var(--border-hover); }

  .locale-switch {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-accent);
    cursor: pointer;
    padding: 6px 10px;
    border: none;
    background: none;
    font-family: inherit;
  }

  /* ── TIMELINE CONTAINER ── */
  .timeline-viewport {
    position: fixed;
    top: 56px;
    left: 0; right: 0; bottom: 0;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: thin;
    scrollbar-color: rgba(201,169,110,0.3) transparent;
  }
  .timeline-viewport::-webkit-scrollbar { height: 6px; }
  .timeline-viewport::-webkit-scrollbar-track { background: transparent; }
  .timeline-viewport::-webkit-scrollbar-thumb { background: rgba(201,169,110,0.3); border-radius: 3px; }

  .timeline-canvas {
    position: relative;
    width: 8000px;
    height: calc(100vh - 56px);
  }

  /* ── LAYER 1: ERA BACKGROUNDS ── */
  .era-bg-layer {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    display: flex;
    will-change: transform;
  }

  .era-bg {
    height: 100%;
    position: relative;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 80px;
  }

  .era-bg-title {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 900;
    font-size: 72px;
    color: rgba(201,169,110,0.06);
    white-space: nowrap;
    text-transform: uppercase;
    letter-spacing: 8px;
    user-select: none;
    pointer-events: none;
  }

  .era-divider {
    position: absolute;
    right: 0;
    top: 10%;
    height: 80%;
    width: 1px;
    background: linear-gradient(to bottom, transparent, rgba(201,169,110,0.15), transparent);
  }

  /* ── LAYER 2: TIME AXIS ── */
  .axis-layer {
    position: absolute;
    top: 62%;
    left: 0;
    height: 48px;
    width: 100%;
    will-change: transform;
  }

  .axis-line {
    position: absolute;
    top: 24px;
    left: 0; right: 0;
    height: 1px;
    background: rgba(201,169,110,0.2);
  }

  .axis-tick {
    position: absolute;
    top: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .axis-tick-mark {
    width: 1px;
    height: 16px;
    background: rgba(201,169,110,0.25);
  }

  .axis-tick-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-secondary);
    margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }

  .axis-event {
    position: absolute;
    top: 0;
  }

  .axis-event-diamond {
    width: 10px;
    height: 10px;
    background: var(--text-accent);
    transform: rotate(45deg);
    cursor: pointer;
    transition: transform 200ms;
  }
  .axis-event-diamond:hover {
    transform: rotate(45deg) scale(1.3);
  }

  .axis-event-tooltip {
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    margin-bottom: 8px;
    padding: 6px 12px;
    background: var(--bg-elevated);
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    backdrop-filter: blur(8px);
    white-space: nowrap;
    font-size: 11px;
    color: var(--text-primary);
    opacity: 0;
    pointer-events: none;
    transition: opacity 200ms;
  }
  .axis-event:hover .axis-event-tooltip { opacity: 1; }

  /* ── LAYER 3: SHOW CARDS ── */
  .cards-layer {
    position: absolute;
    top: 68%;
    left: 0;
    width: 100%;
    height: 32%;
    display: flex;
    align-items: flex-start;
  }

  .show-card {
    position: absolute;
    width: 136px;
    cursor: pointer;
    transition: transform 200ms cubic-bezier(0.2,0,0,1), box-shadow 200ms;
  }
  .show-card:hover {
    transform: translateY(-8px) scale(1.05);
    z-index: 10;
  }

  .card-poster {
    width: 120px;
    height: 180px;
    border-radius: 10px;
    background: var(--bg-surface);
    outline: 1px solid rgba(255,255,255,0.08);
    overflow: hidden;
    margin: 0 auto;
    position: relative;
  }

  .card-poster img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .card-poster-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-weight: 700;
    color: rgba(201,169,110,0.3);
  }

  .card-info {
    padding: 8px 4px 0;
    text-align: center;
  }

  .card-title {
    font-size: 13px;
    font-weight: 500;
    line-height: 1.3;
    text-wrap: balance;
    color: var(--text-primary);
    margin-bottom: 2px;
  }

  .card-years {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
    margin-bottom: 4px;
  }

  .card-stars {
    color: var(--text-accent);
    font-size: 10px;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }

  .card-platform {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    background: rgba(201,169,110,0.1);
    color: var(--text-accent);
    border: 1px solid rgba(201,169,110,0.15);
  }

  /* Narrative span line */
  .card-span-line {
    position: absolute;
    top: 90px;
    left: 100%;
    height: 2px;
    background: linear-gradient(to right, var(--text-accent), transparent);
    opacity: 0.3;
    pointer-events: none;
  }

  /* ── BOTTOM SHEET PREVIEW ── */
  .bottom-sheet {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 0;
    background: var(--bg-elevated);
    border-top: 1px solid var(--border-subtle);
    border-radius: 20px 20px 0 0;
    transition: height 400ms cubic-bezier(0.33, 1, 0.68, 1);
    z-index: 90;
    overflow: hidden;
  }
  .bottom-sheet.open { height: 40vh; }

  .sheet-handle {
    width: 40px;
    height: 4px;
    background: rgba(255,255,255,0.15);
    border-radius: 2px;
    margin: 12px auto;
    cursor: grab;
  }

  .sheet-content {
    padding: 0 40px 40px;
    display: flex;
    gap: 32px;
    opacity: 0;
    transition: opacity 300ms 200ms;
  }
  .bottom-sheet.open .sheet-content { opacity: 1; }

  .sheet-poster {
    width: 160px;
    height: 240px;
    border-radius: 12px;
    background: var(--bg-surface);
    outline: 1px solid rgba(255,255,255,0.08);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Playfair Display', serif;
    font-size: 36px;
    color: rgba(201,169,110,0.3);
  }

  .sheet-details { flex: 1; }

  .sheet-title {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 4px;
  }

  .sheet-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 12px;
  }

  .sheet-synopsis {
    font-size: 14px;
    line-height: 1.6;
    color: var(--text-secondary);
    max-width: 600px;
    margin-bottom: 16px;
  }

  .sheet-platforms {
    display: flex;
    gap: 8px;
  }

  .sheet-platform-btn {
    padding: 8px 20px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    background: rgba(201,169,110,0.1);
    color: var(--text-accent);
    border: 1px solid rgba(201,169,110,0.2);
    cursor: pointer;
    font-family: inherit;
    transition: all 150ms;
  }
  .sheet-platform-btn:hover {
    background: rgba(201,169,110,0.2);
  }

  /* ── BACKDROP ── */
  .sheet-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 89;
    opacity: 0;
    pointer-events: none;
    transition: opacity 300ms;
  }
  .sheet-backdrop.visible { opacity: 1; pointer-events: auto; }

  /* ── DESIGN LABEL ── */
  .design-label {
    position: fixed;
    top: 68px;
    right: 24px;
    padding: 8px 16px;
    background: rgba(201,169,110,0.1);
    border: 1px solid rgba(201,169,110,0.2);
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-accent);
    z-index: 101;
    letter-spacing: 0.5px;
  }
  .design-label span {
    display: block;
    font-size: 10px;
    font-weight: 400;
    color: var(--text-secondary);
    margin-top: 2px;
  }
</style>
</head>
<body>

<div class="design-label">
  DESIGN 1 — CINÉMATHÈQUE
  <span>Dark museum, gold accents, serif elegance</span>
</div>

<!-- NAV -->
<nav class="nav">
  <div class="nav-logo">FRISE SÉRIE</div>
  <div class="nav-eras">
    <button class="era-pill active">Antiquité</button>
    <button class="era-pill">Moyen Âge</button>
    <button class="era-pill">Renaissance</button>
    <button class="era-pill">Époque Moderne</button>
    <button class="era-pill">Révolutions</button>
    <button class="era-pill">XIXe siècle</button>
    <button class="era-pill">Guerres mondiales</button>
    <button class="era-pill">Guerre froide</button>
    <button class="era-pill">Contemporain</button>
  </div>
  <div class="nav-actions">
    <button class="nav-btn">⚙ Filtres</button>
    <button class="locale-switch">FR</button>
  </div>
</nav>

<!-- TIMELINE -->
<div class="timeline-viewport" id="viewport">
  <div class="timeline-canvas">

    <!-- LAYER 1: Era Backgrounds -->
    <div class="era-bg-layer" id="bgLayer">
      <div class="era-bg" style="width:1200px; background: linear-gradient(to right, #1a0a00, #2d1810, #4a2a1a);">
        <div class="era-bg-title">Antiquité</div>
        <div class="era-divider"></div>
      </div>
      <div class="era-bg" style="width:1400px; background: linear-gradient(to right, #0a0f1a, #1a2040, #2a1a30);">
        <div class="era-bg-title">Moyen Âge</div>
        <div class="era-divider"></div>
      </div>
      <div class="era-bg" style="width:800px; background: linear-gradient(to right, #1a1000, #3d2b00, #5c4a1a);">
        <div class="era-bg-title">Renaissance</div>
        <div class="era-divider"></div>
      </div>
      <div class="era-bg" style="width:900px; background: linear-gradient(to right, #0a1a1a, #1a3030, #2a1a3a);">
        <div class="era-bg-title">Époque Moderne</div>
        <div class="era-divider"></div>
      </div>
      <div class="era-bg" style="width:500px; background: linear-gradient(to right, #1a0a0a, #3a1010, #4a1a1a);">
        <div class="era-bg-title">Révolutions</div>
        <div class="era-divider"></div>
      </div>
      <div class="era-bg" style="width:700px; background: linear-gradient(to right, #0f0f1a, #1a1a2a, #2a2530);">
        <div class="era-bg-title">XIXe Siècle</div>
        <div class="era-divider"></div>
      </div>
      <div class="era-bg" style="width:600px; background: linear-gradient(to right, #0a0a0a, #1a1a1a, #2a2020);">
        <div class="era-bg-title">Guerres</div>
        <div class="era-divider"></div>
      </div>
      <div class="era-bg" style="width:800px; background: linear-gradient(to right, #0a0a1a, #101a2a, #1a2a3a);">
        <div class="era-bg-title">Guerre Froide</div>
        <div class="era-divider"></div>
      </div>
      <div class="era-bg" style="width:1100px; background: linear-gradient(to right, #0a0f14, #141e28, #1e2832);">
        <div class="era-bg-title">Contemporain</div>
      </div>
    </div>

    <!-- LAYER 2: Axis -->
    <div class="axis-layer" id="axisLayer">
      <div class="axis-line"></div>
      <!-- Ticks and events generated by JS -->
    </div>

    <!-- LAYER 3: Show Cards -->
    <div class="cards-layer" id="cardsLayer">
      <!-- Cards generated by JS -->
    </div>

  </div>
</div>

<!-- BOTTOM SHEET -->
<div class="sheet-backdrop" id="backdrop"></div>
<div class="bottom-sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-content" id="sheetContent"></div>
</div>

<script>
const shows = [
  { title:"Spartacus", years:"73 av. J.-C.", start:-73, end:-71, stars:3, platform:"Prime Video", era:"antiquity", pos:200 },
  { title:"Rome", years:"52 av. J.-C. – 44 av. J.-C.", start:-52, end:-44, stars:4, platform:"Max", era:"antiquity", pos:400 },
  { title:"Vikings", years:"793 – 1002", start:793, end:1002, stars:4, platform:"Netflix", era:"medieval", pos:1500 },
  { title:"The Last Kingdom", years:"866 – 950", start:866, end:950, stars:4, platform:"Netflix", era:"medieval", pos:1700 },
  { title:"Knightfall", years:"1306 – 1314", start:1306, end:1314, stars:3, platform:"Netflix", era:"medieval", pos:2100 },
  { title:"Marco Polo", years:"1271 – 1300", start:1271, end:1300, stars:3, platform:"Netflix", era:"medieval", pos:1950 },
  { title:"Les Borgia", years:"1492 – 1507", start:1492, end:1507, stars:4, platform:"Canal+", era:"renaissance", pos:2700 },
  { title:"Les Tudors", years:"1509 – 1547", start:1509, end:1547, stars:4, platform:"Prime Video", era:"renaissance", pos:2900 },
  { title:"Reign", years:"1557 – 1567", start:1557, end:1567, stars:2, platform:"Netflix", era:"renaissance", pos:3100 },
  { title:"Versailles", years:"1667 – 1715", start:1667, end:1715, stars:4, platform:"Canal+", era:"baroque", pos:3500 },
  { title:"Black Sails", years:"1715 – 1725", start:1715, end:1725, stars:4, platform:"Prime Video", era:"baroque", pos:3800 },
  { title:"Turn", years:"1776 – 1783", start:1776, end:1783, stars:3, platform:"Prime Video", era:"revolution", pos:4300 },
  { title:"Les Misérables", years:"1815 – 1832", start:1815, end:1832, stars:4, platform:"Arte", era:"19th", pos:4700 },
  { title:"Peaky Blinders", years:"1919 – 1934", start:1919, end:1934, stars:4, platform:"Netflix", era:"20th", pos:5200 },
  { title:"Band of Brothers", years:"1944", start:1944, end:1945, stars:5, platform:"Max", era:"ww", pos:5800 },
  { title:"Shogun", years:"1600", start:1600, end:1600, stars:5, platform:"Disney+", era:"baroque", pos:3350 },
];

const events = [
  { year:-3000, label:"Début de l'Antiquité", pos:50 },
  { year:-52, label:"Guerre des Gaules", pos:380 },
  { year:476, label:"Chute de Rome", pos:1200 },
  { year:1066, label:"Conquête normande", pos:1850 },
  { year:1453, label:"Chute de Constantinople", pos:2600 },
  { year:1492, label:"Découverte de l'Amérique", pos:2700 },
  { year:1789, label:"Révolution française", pos:4200 },
  { year:1815, label:"Waterloo", pos:4700 },
  { year:1914, label:"Début WWI", pos:5100 },
  { year:1945, label:"Fin WWII", pos:5900 },
  { year:1991, label:"Fin Guerre froide", pos:6700 },
];

const ticks = [];
for (let y = -3000; y <= 2025; y += 100) {
  const ratio = (y + 3000) / 5025;
  ticks.push({ year: y, pos: Math.round(ratio * 8000) });
}

// Render axis
const axisLayer = document.getElementById('axisLayer');
ticks.forEach(t => {
  const tick = document.createElement('div');
  tick.className = 'axis-tick';
  tick.style.left = t.pos + 'px';
  const label = t.year < 0 ? Math.abs(t.year) + ' av. J.-C.' : t.year.toString();
  tick.innerHTML = `<div class="axis-tick-mark"></div><div class="axis-tick-label">${label}</div>`;
  axisLayer.appendChild(tick);
});

events.forEach(e => {
  const ev = document.createElement('div');
  ev.className = 'axis-event';
  ev.style.left = e.pos + 'px';
  ev.innerHTML = `<div class="axis-event-diamond"></div><div class="axis-event-tooltip">${e.label} (${e.year < 0 ? Math.abs(e.year)+' av. J.-C.' : e.year})</div>`;
  axisLayer.appendChild(ev);
});

// Render cards with swim lanes
const cardsLayer = document.getElementById('cardsLayer');
const lanes = [];

shows.forEach((s, i) => {
  let lane = 0;
  for (let l = 0; l < lanes.length; l++) {
    if (s.pos - lanes[l] >= 152) { lane = l; break; }
    lane = l + 1;
  }
  lanes[lane] = s.pos;

  const card = document.createElement('div');
  card.className = 'show-card';
  card.style.left = s.pos + 'px';
  card.style.top = (lane * 292) + 'px';
  card.dataset.index = i;

  const starsStr = '★'.repeat(s.stars) + '☆'.repeat(5 - s.stars);

  card.innerHTML = `
    <div class="card-poster"><div class="card-poster-placeholder">${s.title[0]}</div></div>
    <div class="card-info">
      <div class="card-title">${s.title}</div>
      <div class="card-years">${s.years}</div>
      <div class="card-stars">${starsStr}</div>
      <span class="card-platform">${s.platform}</span>
    </div>
  `;

  card.addEventListener('click', () => openSheet(s));
  cardsLayer.appendChild(card);
});

// Bottom sheet
const sheet = document.getElementById('sheet');
const backdrop = document.getElementById('backdrop');
const sheetContent = document.getElementById('sheetContent');

function openSheet(s) {
  const starsStr = '★'.repeat(s.stars) + '☆'.repeat(5 - s.stars);
  sheetContent.innerHTML = `
    <div class="sheet-poster">${s.title[0]}</div>
    <div class="sheet-details">
      <div class="sheet-title">${s.title}</div>
      <div class="sheet-meta">${s.years} · ${starsStr} Fiabilité historique</div>
      <div class="sheet-synopsis">Synopsis historique de la série ${s.title}. Cette série explore les événements de l'époque avec un regard dramatique sur les personnages et les conflits qui ont marqué cette période de l'histoire.</div>
      <div class="sheet-platforms">
        <button class="sheet-platform-btn">▶ ${s.platform}</button>
        <button class="sheet-platform-btn">📎 Copier le lien</button>
        <button class="sheet-platform-btn">Wikipedia ↗</button>
      </div>
    </div>
  `;
  sheet.classList.add('open');
  backdrop.classList.add('visible');
}

backdrop.addEventListener('click', () => {
  sheet.classList.remove('open');
  backdrop.classList.remove('visible');
});

// Parallax on scroll
const viewport = document.getElementById('viewport');
const bgLayer = document.getElementById('bgLayer');

viewport.addEventListener('scroll', () => {
  const scrollX = viewport.scrollLeft;
  bgLayer.style.transform = `translateX(${-scrollX * 0.3}px)`;
  axisLayer.style.transform = `translateX(${-scrollX * 0.0}px)`;
}, { passive: true });

// Mouse wheel → horizontal scroll
viewport.addEventListener('wheel', (e) => {
  if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
    e.preventDefault();
    viewport.scrollLeft += e.deltaY;
  }
}, { passive: false });
</script>
