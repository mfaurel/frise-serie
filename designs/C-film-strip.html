<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frise Serie — Concept C: Film Strip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ── Reset & Base ───────────────────────────────────────── */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --film-bg: #1a1a1a;
  --film-border: #2a2a2a;
  --film-surface: #111;
  --sprocket-bg: #0a0a0a;
  --frame-border: #444;
  --sepia-warm: rgba(180, 140, 80, 0.06);
  --curtain-red: #5a0a0a;
  --gold: #c9a84c;
  --gold-dim: #8a7030;
  --text-primary: #e8e0d0;
  --text-secondary: #a09880;
  --text-dim: #706858;
  --spotlight: rgba(255, 240, 200, 0.15);
  --frame-width: 260px;
  --frame-height: 370px;
  --strip-height: 460px;
  --sprocket-size: 18px;
}

html {
  background: #0a0a0a;
  color: var(--text-primary);
  font-family: 'Source Sans 3', 'Source Sans Pro', sans-serif;
  overflow: hidden;
  height: 100%;
}

body {
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

/* ── Film Grain Overlay ─────────────────────────────────── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 9999;
  pointer-events: none;
  opacity: 0.035;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 200px 200px;
}

/* ── Cinema Curtain Vignette ────────────────────────────── */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background:
    radial-gradient(ellipse at center, transparent 30%, rgba(10,5,5,0.4) 70%, rgba(5,0,0,0.85) 100%),
    linear-gradient(90deg, var(--curtain-red) 0%, transparent 12%, transparent 88%, var(--curtain-red) 100%);
}

/* ── Top: Era Title ─────────────────────────────────────── */
.era-title-bar {
  flex: 0 0 auto;
  height: 15vh;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  z-index: 5;
}

.era-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(2.5rem, 6vw, 5rem);
  color: var(--gold);
  letter-spacing: 0.25em;
  text-transform: uppercase;
  text-shadow:
    0 0 40px rgba(200, 170, 80, 0.3),
    0 2px 4px rgba(0,0,0,0.6);
  transition: opacity 0.5s ease, transform 0.5s ease;
  white-space: nowrap;
}

/* ── Middle: Film Strip ─────────────────────────────────── */
.film-strip-viewport {
  flex: 0 0 auto;
  height: 60vh;
  display: flex;
  align-items: center;
  overflow: hidden;
  position: relative;
  z-index: 5;
  perspective: 1200px;
}

.film-strip-track {
  display: flex;
  align-items: center;
  height: var(--strip-height);
  padding: 0 50vw;
  cursor: grab;
  transform: rotateY(-1.5deg);
  transform-style: preserve-3d;
  transition: transform 0.1s ease-out;
  will-change: transform;
}

.film-strip-track.dragging {
  cursor: grabbing;
  transition: none;
}

/* ── Film Strip Background (sprocket rail) ──────────────── */
.film-strip-track::before {
  content: '';
  position: absolute;
  top: 0; bottom: 0;
  left: 0; right: 0;
  background: var(--film-surface);
  border-top: 3px solid var(--film-border);
  border-bottom: 3px solid var(--film-border);
  z-index: -1;
}

/* ── Sprocket Holes (generated via JS) ──────────────────── */
.sprocket-row {
  position: absolute;
  left: 0;
  display: flex;
  gap: 20px;
  z-index: 2;
  pointer-events: none;
}

.sprocket-row.top { top: 10px; }
.sprocket-row.bottom { bottom: 10px; }

.sprocket {
  width: var(--sprocket-size);
  height: calc(var(--sprocket-size) * 1.3);
  background: var(--sprocket-bg);
  border-radius: 3px;
  border: 1px solid #333;
  flex-shrink: 0;
  box-shadow: inset 0 1px 3px rgba(0,0,0,0.8);
}

/* ── Film Frame (show card) ─────────────────────────────── */
.film-frame {
  flex-shrink: 0;
  width: var(--frame-width);
  height: var(--frame-height);
  margin: 0 14px;
  position: relative;
  border: 3px solid var(--frame-border);
  border-radius: 2px;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94),
              box-shadow 0.35s ease,
              border-color 0.35s ease;
  background: #1a1610;
  box-shadow: 0 2px 12px rgba(0,0,0,0.5);
}

.film-frame:hover {
  transform: scale(1.06);
  border-color: var(--gold-dim);
  box-shadow: 0 4px 30px rgba(200, 170, 80, 0.2), 0 0 60px rgba(200, 170, 80, 0.08);
  z-index: 10;
}

.frame-poster {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* Poster placeholder — sepia gradient */
.frame-poster-placeholder {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 4rem;
  color: rgba(200, 170, 80, 0.15);
  position: relative;
}

.frame-poster-placeholder .icon {
  font-size: 3.5rem;
  opacity: 0.3;
}

.frame-info {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 40px 14px 14px;
  background: linear-gradient(to top, rgba(10,8,5,0.95) 0%, rgba(10,8,5,0.7) 60%, transparent 100%);
  z-index: 3;
}

.frame-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.3rem;
  color: var(--text-primary);
  letter-spacing: 0.08em;
  line-height: 1.15;
  margin-bottom: 6px;
}

.frame-date {
  font-size: 0.8rem;
  color: var(--gold);
  font-weight: 600;
  margin-bottom: 4px;
}

.frame-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.badge {
  font-size: 0.65rem;
  padding: 2px 7px;
  border-radius: 2px;
  font-weight: 600;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}

.badge-platform {
  background: rgba(200, 170, 80, 0.15);
  color: var(--gold);
  border: 1px solid rgba(200, 170, 80, 0.25);
}

.badge-rating {
  background: rgba(255, 255, 255, 0.06);
  color: var(--text-secondary);
  border: 1px solid rgba(255, 255, 255, 0.1);
  letter-spacing: 1px;
}

/* ── Reel Change Divider ────────────────────────────────── */
.reel-change {
  flex-shrink: 0;
  width: 320px;
  height: var(--frame-height);
  margin: 0 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
}

.reel-change::before,
.reel-change::after {
  content: '';
  position: absolute;
  top: 10%;
  bottom: 10%;
  width: 2px;
  background: repeating-linear-gradient(
    to bottom,
    var(--frame-border) 0px,
    var(--frame-border) 6px,
    transparent 6px,
    transparent 12px
  );
}

.reel-change::before { left: 20px; }
.reel-change::after { right: 20px; }

.countdown-circles {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}

.countdown-circle {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 2px solid var(--frame-border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1rem;
  color: var(--text-secondary);
  position: relative;
}

.countdown-circle::after {
  content: '';
  position: absolute;
  inset: 3px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.06);
}

.reel-era-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.5rem;
  color: var(--gold);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  text-align: center;
  line-height: 1.3;
}

.reel-era-sub {
  font-size: 0.75rem;
  color: var(--text-dim);
  margin-top: 6px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

/* ── Bottom: Time Axis ──────────────────────────────────── */
.time-axis-bar {
  flex: 0 0 auto;
  height: 25vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding-top: 2vh;
  position: relative;
  z-index: 5;
}

.axis-line {
  width: 60%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--frame-border), transparent);
  margin-bottom: 14px;
}

.axis-years {
  display: flex;
  gap: 0;
  justify-content: center;
  flex-wrap: nowrap;
  overflow: hidden;
  width: 80%;
}

.axis-year {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 0.95rem;
  color: var(--text-dim);
  padding: 0 14px;
  white-space: nowrap;
  transition: color 0.3s, transform 0.3s;
}

.axis-year.active {
  color: var(--gold);
  transform: scale(1.15);
}

.scroll-hint {
  margin-top: 18px;
  font-size: 0.75rem;
  color: var(--text-dim);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  animation: pulse-hint 2.5s ease-in-out infinite;
}

@keyframes pulse-hint {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 0.9; }
}

/* ── Detail Overlay (Projector Mode) ────────────────────── */
.projector-overlay {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
}

.projector-overlay.visible {
  opacity: 1;
  pointer-events: auto;
}

.projector-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.88);
  cursor: pointer;
}

/* Projector beam cone */
.projector-beam {
  position: absolute;
  top: -60px;
  left: 50%;
  transform: translateX(-50%);
  width: 500px;
  height: 120%;
  background: linear-gradient(
    to bottom,
    rgba(255, 240, 200, 0.08) 0%,
    rgba(255, 240, 200, 0.03) 30%,
    transparent 80%
  );
  clip-path: polygon(42% 0%, 58% 0%, 75% 100%, 25% 100%);
  pointer-events: none;
}

.projector-card {
  position: relative;
  width: 440px;
  max-width: 90vw;
  background: #1a1610;
  border: 3px solid var(--gold-dim);
  border-radius: 3px;
  overflow: hidden;
  transform: scale(0.85);
  transition: transform 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  box-shadow:
    0 0 80px rgba(200, 170, 80, 0.15),
    0 0 200px rgba(200, 170, 80, 0.05),
    0 20px 60px rgba(0, 0, 0, 0.6);
}

.projector-overlay.visible .projector-card {
  transform: scale(1);
}

.projector-poster {
  width: 100%;
  height: 300px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.projector-poster .icon {
  font-size: 5rem;
  opacity: 0.2;
  color: var(--gold);
}

.projector-body {
  padding: 24px;
}

.projector-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 2.2rem;
  color: var(--text-primary);
  letter-spacing: 0.1em;
  margin-bottom: 4px;
}

.projector-era {
  font-size: 0.8rem;
  color: var(--gold);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-bottom: 16px;
}

.projector-detail-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-top: 1px solid rgba(255,255,255,0.06);
}

.projector-label {
  font-size: 0.75rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

.projector-value {
  font-size: 0.95rem;
  color: var(--text-primary);
  font-weight: 600;
}

.projector-stars {
  color: var(--gold);
  letter-spacing: 2px;
}

.projector-close {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(0,0,0,0.5);
  color: var(--text-secondary);
  font-size: 1.2rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s, color 0.2s;
  z-index: 10;
}

.projector-close:hover {
  background: rgba(200, 170, 80, 0.2);
  color: var(--gold);
}

/* ── Poster Placeholder Gradients per Era ───────────────── */
.poster-antiquite    { background: linear-gradient(135deg, #3a2510 0%, #1a1005 40%, #2a1808 100%); }
.poster-moyen-age    { background: linear-gradient(135deg, #1a2a1a 0%, #0a150a 40%, #152015 100%); }
.poster-renaissance  { background: linear-gradient(135deg, #2a1a2a 0%, #100a15 40%, #1a1020 100%); }
.poster-moderne      { background: linear-gradient(135deg, #1a2028 0%, #0a1018 40%, #101520 100%); }
.poster-revolutions  { background: linear-gradient(135deg, #2a2018 0%, #151008 40%, #201810 100%); }
.poster-guerres      { background: linear-gradient(135deg, #1a1a20 0%, #0a0a10 40%, #121218 100%); }

/* ── Scrollbar ──────────────────────────────────────────── */
.film-strip-viewport::-webkit-scrollbar { display: none; }

/* ── Utility ────────────────────────────────────────────── */
.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  border: 0;
}
</style>
</head>
<body>

<!-- Era Title -->
<div class="era-title-bar">
  <h1 class="era-title" id="eraTitle">Antiquite</h1>
</div>

<!-- Film Strip -->
<div class="film-strip-viewport" id="viewport">
  <div class="film-strip-track" id="track">
    <!-- Sprocket rows injected by JS -->
    <!-- Frames and reel-changes injected by JS -->
  </div>
</div>

<!-- Time Axis -->
<div class="time-axis-bar">
  <div class="axis-line"></div>
  <div class="axis-years" id="axisYears"></div>
  <div class="scroll-hint" id="scrollHint">&#9664;  Faire defiler pour explorer  &#9654;</div>
</div>

<!-- Projector Overlay -->
<div class="projector-overlay" id="projectorOverlay">
  <div class="projector-backdrop" id="projectorBackdrop"></div>
  <div class="projector-beam"></div>
  <div class="projector-card" id="projectorCard">
    <button class="projector-close" id="projectorClose" aria-label="Fermer">&times;</button>
    <div class="projector-poster" id="projectorPoster">
      <span class="icon">&#127902;</span>
    </div>
    <div class="projector-body">
      <div class="projector-title" id="projectorTitle"></div>
      <div class="projector-era" id="projectorEra"></div>
      <div class="projector-detail-row">
        <span class="projector-label">Periode</span>
        <span class="projector-value" id="projectorDate"></span>
      </div>
      <div class="projector-detail-row">
        <span class="projector-label">Note</span>
        <span class="projector-value projector-stars" id="projectorRating"></span>
      </div>
      <div class="projector-detail-row">
        <span class="projector-label">Plateforme</span>
        <span class="projector-value" id="projectorPlatform"></span>
      </div>
    </div>
  </div>
</div>

<script>
/* ================================================================
   DATA
   ================================================================ */
const ERAS = [
  {
    id: 'antiquite',
    name: 'Antiquite',
    posterClass: 'poster-antiquite',
    shows: [
      { title: 'Spartacus',    date: '73 av. J.-C.',     rating: 3, platform: 'Prime Video' },
      { title: 'Rome',         date: '52 – 44 av. J.-C.', rating: 4, platform: 'Max' },
    ]
  },
  {
    id: 'moyen-age',
    name: 'Moyen Âge',
    posterClass: 'poster-moyen-age',
    shows: [
      { title: 'Vikings',          date: '793 – 1002', rating: 4, platform: 'Netflix' },
      { title: 'The Last Kingdom', date: '866 – 950',  rating: 4, platform: 'Netflix' },
      { title: 'Knightfall',       date: '1306 – 1314', rating: 3, platform: 'Netflix' },
      { title: 'Marco Polo',       date: '1271 – 1300', rating: 3, platform: 'Netflix' },
    ]
  },
  {
    id: 'renaissance',
    name: 'Renaissance',
    posterClass: 'poster-renaissance',
    shows: [
      { title: 'Les Borgia', date: '1492 – 1507', rating: 4, platform: 'Canal+' },
      { title: 'Les Tudors', date: '1509 – 1547', rating: 4, platform: 'Prime Video' },
      { title: 'Reign',      date: '1557 – 1567', rating: 2, platform: 'Netflix' },
    ]
  },
  {
    id: 'moderne',
    name: 'Epoque Moderne',
    posterClass: 'poster-moderne',
    shows: [
      { title: 'Shōgun',   date: '1600',           rating: 5, platform: 'Disney+' },
      { title: 'Versailles',    date: '1667 – 1715', rating: 4, platform: 'Canal+' },
      { title: 'Black Sails',   date: '1715 – 1725', rating: 4, platform: 'Prime Video' },
    ]
  },
  {
    id: 'revolutions',
    name: 'Revolutions',
    posterClass: 'poster-revolutions',
    shows: [
      { title: 'Turn',           date: '1776 – 1783', rating: 3, platform: 'Prime Video' },
      { title: 'Les Miserables', date: '1815 – 1832', rating: 4, platform: 'Arte' },
    ]
  },
  {
    id: 'guerres',
    name: 'Guerres Mondiales',
    posterClass: 'poster-guerres',
    shows: [
      { title: 'Peaky Blinders',  date: '1919 – 1934', rating: 4, platform: 'Netflix' },
      { title: 'Band of Brothers', date: '1944',            rating: 5, platform: 'Max' },
    ]
  },
];

/* ================================================================
   ICONS per show (simple emoji placeholders)
   ================================================================ */
const SHOW_ICONS = {
  'Spartacus': '⚔️',
  'Rome': '\u{1F3DB}️',
  'Vikings': '\u{1FA93}',
  'The Last Kingdom': '\u{1F6E1}️',
  'Knightfall': '⚔️',
  'Marco Polo': '\u{1F9ED}',
  'Les Borgia': '\u{1F451}',
  'Les Tudors': '\u{1F451}',
  'Reign': '\u{1F451}',
  'Shōgun': '\u{1F5E1}️',
  'Versailles': '\u{1F3F0}',
  'Black Sails': '\u{1F3F4}‍☠️',
  'Turn': '\u{1F4DC}',
  'Les Miserables': '\u{1F56F}️',
  'Peaky Blinders': '\u{1F3A9}',
  'Band of Brothers': '\u{1FA96}',
};

/* ================================================================
   BUILD THE FILM STRIP
   ================================================================ */
const track = document.getElementById('track');
const viewport = document.getElementById('viewport');
const eraTitle = document.getElementById('eraTitle');
const axisYears = document.getElementById('axisYears');

// Store references for scroll-based era detection
const eraElements = [];

function stars(n) {
  return '★'.repeat(n) + '☆'.repeat(5 - n);
}

function buildFrame(show, era) {
  const frame = document.createElement('div');
  frame.className = 'film-frame';
  frame.dataset.show = JSON.stringify({ ...show, era: era.name });

  const poster = document.createElement('div');
  poster.className = 'frame-poster-placeholder ' + era.posterClass;
  const icon = document.createElement('span');
  icon.className = 'icon';
  icon.textContent = SHOW_ICONS[show.title] || '\u{1F3AC}';
  poster.appendChild(icon);
  frame.appendChild(poster);

  const info = document.createElement('div');
  info.className = 'frame-info';
  info.innerHTML = `
    <div class="frame-title">${show.title}</div>
    <div class="frame-date">${show.date}</div>
    <div class="frame-meta">
      <span class="badge badge-platform">${show.platform}</span>
      <span class="badge badge-rating">${stars(show.rating)}</span>
    </div>
  `;
  frame.appendChild(info);

  frame.addEventListener('click', () => openProjector(show, era));
  return frame;
}

function buildReelChange(era) {
  const reel = document.createElement('div');
  reel.className = 'reel-change';
  reel.dataset.era = era.name;

  const circles = document.createElement('div');
  circles.className = 'countdown-circles';
  for (let i = 5; i >= 1; i--) {
    const c = document.createElement('div');
    c.className = 'countdown-circle';
    c.textContent = i;
    circles.appendChild(c);
  }
  reel.appendChild(circles);

  const name = document.createElement('div');
  name.className = 'reel-era-name';
  name.textContent = era.name;
  reel.appendChild(name);

  const sub = document.createElement('div');
  sub.className = 'reel-era-sub';
  sub.textContent = 'Changement de bobine';
  reel.appendChild(sub);

  return reel;
}

// Assemble track
ERAS.forEach((era, eraIdx) => {
  // Reel change before each era
  const reel = buildReelChange(era);
  track.appendChild(reel);
  eraElements.push({ el: reel, era });

  era.shows.forEach(show => {
    const frame = buildFrame(show, era);
    track.appendChild(frame);
  });
});

/* ================================================================
   SPROCKET HOLES
   ================================================================ */
function buildSprockets() {
  const trackWidth = track.scrollWidth;
  const spacing = 38; // px between sprocket centers
  const count = Math.ceil(trackWidth / spacing);

  ['top', 'bottom'].forEach(pos => {
    const row = document.createElement('div');
    row.className = 'sprocket-row ' + pos;
    row.style.width = trackWidth + 'px';
    row.style.paddingLeft = '6px';
    for (let i = 0; i < count; i++) {
      const s = document.createElement('div');
      s.className = 'sprocket';
      row.appendChild(s);
    }
    track.appendChild(row);
  });
}

buildSprockets();

/* ================================================================
   AXIS YEAR LABELS
   ================================================================ */
const AXIS_LABELS = [
  '100 av. J.-C.', '0', '500', '800', '1000',
  '1200', '1300', '1400', '1500', '1600',
  '1700', '1800', '1900', '1945'
];

AXIS_LABELS.forEach(label => {
  const span = document.createElement('span');
  span.className = 'axis-year';
  span.textContent = label;
  axisYears.appendChild(span);
});

/* ================================================================
   HORIZONTAL SCROLL (drag + wheel)
   ================================================================ */
let scrollPos = 0;
let isDragging = false;
let startX = 0;
let startScroll = 0;
let velocity = 0;
let lastX = 0;
let lastTime = 0;
let animFrame = null;

function setScroll(val) {
  const maxScroll = track.scrollWidth - viewport.clientWidth;
  scrollPos = Math.max(0, Math.min(val, maxScroll));
  track.style.transform = `translateX(${-scrollPos}px) rotateY(-1.5deg)`;
  updateEraFromScroll();
}

viewport.addEventListener('mousedown', e => {
  isDragging = true;
  startX = e.clientX;
  startScroll = scrollPos;
  lastX = e.clientX;
  lastTime = Date.now();
  velocity = 0;
  track.classList.add('dragging');
  if (animFrame) cancelAnimationFrame(animFrame);
  e.preventDefault();
});

document.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const dx = e.clientX - startX;
  const now = Date.now();
  const dt = now - lastTime;
  if (dt > 0) {
    velocity = (e.clientX - lastX) / dt;
  }
  lastX = e.clientX;
  lastTime = now;
  setScroll(startScroll - dx);
});

document.addEventListener('mouseup', () => {
  if (!isDragging) return;
  isDragging = false;
  track.classList.remove('dragging');
  // Momentum
  const friction = 0.95;
  function inertia() {
    if (Math.abs(velocity) < 0.01) return;
    scrollPos -= velocity * 16;
    velocity *= friction;
    const maxScroll = track.scrollWidth - viewport.clientWidth;
    scrollPos = Math.max(0, Math.min(scrollPos, maxScroll));
    track.style.transform = `translateX(${-scrollPos}px) rotateY(-1.5deg)`;
    updateEraFromScroll();
    animFrame = requestAnimationFrame(inertia);
  }
  inertia();
});

// Wheel scroll
viewport.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY || e.deltaX;
  setScroll(scrollPos + delta * 1.5);
}, { passive: false });

// Touch support
viewport.addEventListener('touchstart', e => {
  isDragging = true;
  startX = e.touches[0].clientX;
  startScroll = scrollPos;
  lastX = startX;
  lastTime = Date.now();
  velocity = 0;
  track.classList.add('dragging');
  if (animFrame) cancelAnimationFrame(animFrame);
}, { passive: true });

viewport.addEventListener('touchmove', e => {
  if (!isDragging) return;
  const touch = e.touches[0];
  const dx = touch.clientX - startX;
  const now = Date.now();
  const dt = now - lastTime;
  if (dt > 0) velocity = (touch.clientX - lastX) / dt;
  lastX = touch.clientX;
  lastTime = now;
  setScroll(startScroll - dx);
}, { passive: true });

viewport.addEventListener('touchend', () => {
  if (!isDragging) return;
  isDragging = false;
  track.classList.remove('dragging');
  const friction = 0.95;
  function inertia() {
    if (Math.abs(velocity) < 0.01) return;
    scrollPos -= velocity * 16;
    velocity *= friction;
    const maxScroll = track.scrollWidth - viewport.clientWidth;
    scrollPos = Math.max(0, Math.min(scrollPos, maxScroll));
    track.style.transform = `translateX(${-scrollPos}px) rotateY(-1.5deg)`;
    updateEraFromScroll();
    animFrame = requestAnimationFrame(inertia);
  }
  inertia();
});

/* ================================================================
   ERA DETECTION ON SCROLL
   ================================================================ */
function updateEraFromScroll() {
  const viewCenter = scrollPos + viewport.clientWidth / 2;
  let currentEra = ERAS[0].name;

  eraElements.forEach(({ el, era }) => {
    const elCenter = el.offsetLeft + el.offsetWidth / 2;
    if (viewCenter >= elCenter - 200) {
      currentEra = era.name;
    }
  });

  if (eraTitle.textContent !== currentEra) {
    eraTitle.style.opacity = '0';
    eraTitle.style.transform = 'translateY(-8px)';
    setTimeout(() => {
      eraTitle.textContent = currentEra;
      eraTitle.style.opacity = '1';
      eraTitle.style.transform = 'translateY(0)';
    }, 250);
  }

  // Highlight closest axis year
  updateAxisHighlight();
}

function updateAxisHighlight() {
  const progress = scrollPos / (track.scrollWidth - viewport.clientWidth || 1);
  const idx = Math.round(progress * (AXIS_LABELS.length - 1));
  document.querySelectorAll('.axis-year').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
  });
}

/* ================================================================
   PROJECTOR DETAIL OVERLAY
   ================================================================ */
const overlay = document.getElementById('projectorOverlay');
const projectorBackdrop = document.getElementById('projectorBackdrop');
const projectorClose = document.getElementById('projectorClose');

function openProjector(show, era) {
  document.getElementById('projectorTitle').textContent = show.title;
  document.getElementById('projectorEra').textContent = era.name;
  document.getElementById('projectorDate').textContent = show.date;
  document.getElementById('projectorRating').textContent = stars(show.rating);
  document.getElementById('projectorPlatform').textContent = show.platform;

  // Update poster background
  const poster = document.getElementById('projectorPoster');
  poster.className = 'projector-poster ' + era.posterClass;
  poster.querySelector('.icon').textContent = SHOW_ICONS[show.title] || '\u{1F3AC}';

  overlay.classList.add('visible');
}

function closeProjector() {
  overlay.classList.remove('visible');
}

projectorBackdrop.addEventListener('click', closeProjector);
projectorClose.addEventListener('click', closeProjector);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeProjector();
});

/* ================================================================
   KEYBOARD NAV
   ================================================================ */
document.addEventListener('keydown', e => {
  if (overlay.classList.contains('visible')) return;
  if (e.key === 'ArrowRight') setScroll(scrollPos + 200);
  if (e.key === 'ArrowLeft')  setScroll(scrollPos - 200);
});

/* ================================================================
   INIT
   ================================================================ */
// Initial axis highlight
updateAxisHighlight();

// Hide scroll hint after first interaction
function hideHint() {
  const hint = document.getElementById('scrollHint');
  if (hint) {
    hint.style.opacity = '0';
    setTimeout(() => hint.remove(), 500);
  }
  viewport.removeEventListener('mousedown', hideHint);
  viewport.removeEventListener('wheel', hideHint);
  viewport.removeEventListener('touchstart', hideHint);
}
viewport.addEventListener('mousedown', hideHint);
viewport.addEventListener('wheel', hideHint);
viewport.addEventListener('touchstart', hideHint);
</script>
