<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design 2 — Cartographe</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Libre+Franklin:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-parchment: #f4eed8;
    --bg-paper: #faf6e9;
    --bg-panel: #ede5cc;
    --text-ink: #2c2416;
    --text-secondary: #7a6b52;
    --text-accent: #8b3a2a;
    --border-rule: rgba(44,36,22,0.12);
    --border-strong: rgba(44,36,22,0.25);
    --gold-wash: rgba(180,140,60,0.15);
    --shadow-warm: rgba(44,36,22,0.08);
  }

  html { -webkit-font-smoothing: antialiased; }

  body {
    background: var(--bg-parchment);
    color: var(--text-ink);
    font-family: 'Libre Franklin', system-ui, sans-serif;
    overflow: hidden;
    height: 100vh;
    /* Paper texture via CSS noise */
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(180,140,60,0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 50%, rgba(139,58,42,0.04) 0%, transparent 50%);
  }

  /* ── NAV ── */
  .nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 60px;
    background: var(--bg-paper);
    border-bottom: 2px solid var(--border-rule);
    display: flex;
    align-items: center;
    padding: 0 28px;
    z-index: 100;
    gap: 28px;
    box-shadow: 0 2px 12px var(--shadow-warm);
  }

  .nav-logo {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 700;
    font-size: 22px;
    color: var(--text-accent);
    letter-spacing: 1px;
    white-space: nowrap;
    flex-shrink: 0;
    text-transform: uppercase;
  }
  .nav-logo::after {
    content: '';
    display: inline-block;
    width: 24px;
    height: 2px;
    background: var(--text-accent);
    margin-left: 12px;
    vertical-align: middle;
  }

  .nav-eras {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    scrollbar-width: none;
    flex: 1;
  }
  .nav-eras::-webkit-scrollbar { display: none; }

  .era-pill {
    padding: 6px 16px;
    border-radius: 2px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    border: 1px solid transparent;
    color: var(--text-secondary);
    background: transparent;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    font-family: 'Libre Franklin', sans-serif;
    transition: all 200ms;
  }
  .era-pill:hover, .era-pill.active {
    color: var(--text-accent);
    border-bottom: 2px solid var(--text-accent);
    background: rgba(139,58,42,0.04);
  }

  .nav-actions {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-shrink: 0;
  }

  .nav-btn {
    padding: 7px 18px;
    border-radius: 3px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--border-strong);
    color: var(--text-ink);
    background: transparent;
    font-family: inherit;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    transition: all 150ms;
  }
  .nav-btn:hover { background: var(--gold-wash); }

  .locale-switch {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-accent);
    cursor: pointer;
    padding: 6px 10px;
    border: 1px solid var(--text-accent);
    border-radius: 2px;
    background: none;
    font-family: inherit;
  }

  /* ── TIMELINE CONTAINER ── */
  .timeline-viewport {
    position: fixed;
    top: 60px;
    left: 0; right: 0; bottom: 0;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: thin;
    scrollbar-color: rgba(139,58,42,0.3) transparent;
  }
  .timeline-viewport::-webkit-scrollbar { height: 6px; }
  .timeline-viewport::-webkit-scrollbar-thumb { background: rgba(139,58,42,0.3); border-radius: 3px; }

  .timeline-canvas {
    position: relative;
    width: 8000px;
    height: calc(100vh - 60px);
  }

  /* ── LAYER 1: ERA BACKGROUNDS ── */
  .era-bg-layer {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    display: flex;
    will-change: transform;
  }

  .era-bg {
    height: 100%;
    position: relative;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 60px;
    border-right: 1px dashed rgba(44,36,22,0.1);
  }

  .era-bg-title {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 700;
    font-size: 56px;
    color: rgba(44,36,22,0.05);
    white-space: nowrap;
    text-transform: uppercase;
    letter-spacing: 12px;
    user-select: none;
    pointer-events: none;
  }

  /* Compass rose decorations */
  .era-bg::before {
    content: '✦';
    position: absolute;
    bottom: 20%;
    right: 40px;
    font-size: 48px;
    color: rgba(180,140,60,0.06);
    transform: rotate(15deg);
  }

  /* ── LAYER 2: TIME AXIS ── */
  .axis-layer {
    position: absolute;
    top: 58%;
    left: 0;
    height: 60px;
    width: 100%;
    will-change: transform;
  }

  .axis-line {
    position: absolute;
    top: 30px;
    left: 0; right: 0;
    height: 2px;
    background: repeating-linear-gradient(to right, var(--text-secondary) 0, var(--text-secondary) 8px, transparent 8px, transparent 16px);
    opacity: 0.3;
  }

  .axis-tick {
    position: absolute;
    top: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .axis-tick-mark {
    width: 2px;
    height: 24px;
    background: var(--text-secondary);
    opacity: 0.4;
  }

  .axis-tick-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--text-secondary);
    margin-top: 6px;
    font-variant-numeric: tabular-nums;
  }

  .axis-event {
    position: absolute;
    top: 2px;
  }

  .axis-event-marker {
    width: 14px;
    height: 14px;
    border: 2px solid var(--text-accent);
    border-radius: 50%;
    background: var(--bg-paper);
    cursor: pointer;
    transition: all 200ms;
    position: relative;
  }
  .axis-event-marker::after {
    content: '';
    position: absolute;
    top: 3px; left: 3px;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--text-accent);
  }
  .axis-event-marker:hover { transform: scale(1.4); }

  .axis-event-tooltip {
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    margin-bottom: 8px;
    padding: 8px 14px;
    background: var(--bg-paper);
    border: 1px solid var(--border-strong);
    white-space: nowrap;
    font-size: 11px;
    color: var(--text-ink);
    opacity: 0;
    pointer-events: none;
    transition: opacity 200ms;
    box-shadow: 0 4px 12px var(--shadow-warm);
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 13px;
  }
  .axis-event:hover .axis-event-tooltip { opacity: 1; }

  /* ── LAYER 3: SHOW CARDS ── */
  .cards-layer {
    position: absolute;
    top: 66%;
    left: 0;
    width: 100%;
    height: 34%;
    display: flex;
    align-items: flex-start;
  }

  .show-card {
    position: absolute;
    width: 140px;
    cursor: pointer;
    transition: transform 200ms cubic-bezier(0.2,0,0,1);
  }
  .show-card:hover {
    transform: translateY(-6px);
    z-index: 10;
  }

  .card-poster {
    width: 124px;
    height: 174px;
    border-radius: 4px;
    background: var(--bg-paper);
    border: 2px solid var(--border-rule);
    overflow: hidden;
    margin: 0 auto;
    position: relative;
    box-shadow: 4px 4px 0 rgba(44,36,22,0.06);
    transition: box-shadow 200ms;
  }
  .show-card:hover .card-poster {
    box-shadow: 6px 6px 0 rgba(44,36,22,0.1);
  }

  .card-poster-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 32px;
    font-weight: 700;
    color: rgba(139,58,42,0.2);
    /* Engraving-style hatching */
    background: repeating-linear-gradient(
      45deg,
      transparent 0,
      transparent 4px,
      rgba(44,36,22,0.02) 4px,
      rgba(44,36,22,0.02) 5px
    );
  }

  .card-info {
    padding: 8px 4px 0;
    text-align: center;
  }

  .card-title {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 14px;
    font-weight: 700;
    line-height: 1.3;
    text-wrap: balance;
    color: var(--text-ink);
    margin-bottom: 2px;
  }

  .card-years {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
    margin-bottom: 4px;
  }

  .card-stars {
    color: var(--text-accent);
    font-size: 10px;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }

  .card-platform {
    display: inline-block;
    padding: 2px 8px;
    font-size: 9px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-accent);
    border: 1px solid var(--text-accent);
    border-radius: 1px;
  }

  /* ── BOTTOM SHEET ── */
  .bottom-sheet {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 0;
    background: var(--bg-paper);
    border-top: 2px solid var(--border-strong);
    transition: height 400ms cubic-bezier(0.33, 1, 0.68, 1);
    z-index: 90;
    overflow: hidden;
  }
  .bottom-sheet.open { height: 40vh; }

  .sheet-handle {
    width: 48px;
    height: 3px;
    background: var(--border-strong);
    margin: 14px auto;
    cursor: grab;
  }

  .sheet-content {
    padding: 0 40px 40px;
    display: flex;
    gap: 32px;
    opacity: 0;
    transition: opacity 300ms 200ms;
  }
  .bottom-sheet.open .sheet-content { opacity: 1; }

  .sheet-poster {
    width: 160px;
    height: 224px;
    border: 2px solid var(--border-rule);
    background: var(--bg-parchment);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 40px;
    color: rgba(139,58,42,0.15);
    box-shadow: 6px 6px 0 rgba(44,36,22,0.06);
    background-image: repeating-linear-gradient(45deg, transparent 0, transparent 4px, rgba(44,36,22,0.015) 4px, rgba(44,36,22,0.015) 5px);
  }

  .sheet-details { flex: 1; }

  .sheet-title {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 30px;
    font-weight: 700;
    color: var(--text-ink);
    margin-bottom: 4px;
  }

  .sheet-meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 14px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border-rule);
  }

  .sheet-synopsis {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 16px;
    line-height: 1.7;
    color: var(--text-ink);
    max-width: 560px;
    margin-bottom: 18px;
  }

  .sheet-platforms {
    display: flex;
    gap: 10px;
  }

  .sheet-platform-btn {
    padding: 8px 20px;
    font-size: 12px;
    font-weight: 600;
    background: transparent;
    color: var(--text-accent);
    border: 1px solid var(--text-accent);
    cursor: pointer;
    font-family: inherit;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    transition: all 150ms;
  }
  .sheet-platform-btn:hover {
    background: rgba(139,58,42,0.06);
  }

  /* ── BACKDROP ── */
  .sheet-backdrop {
    position: fixed; inset: 0;
    background: rgba(244,238,216,0.6);
    z-index: 89;
    opacity: 0;
    pointer-events: none;
    transition: opacity 300ms;
  }
  .sheet-backdrop.visible { opacity: 1; pointer-events: auto; }

  /* ── DESIGN LABEL ── */
  .design-label {
    position: fixed;
    top: 72px; right: 24px;
    padding: 10px 18px;
    background: var(--bg-paper);
    border: 2px solid var(--text-accent);
    font-size: 12px;
    font-weight: 600;
    color: var(--text-accent);
    z-index: 101;
    text-transform: uppercase;
    letter-spacing: 1px;
    box-shadow: 4px 4px 0 rgba(139,58,42,0.08);
  }
  .design-label span {
    display: block;
    font-size: 10px;
    font-weight: 400;
    color: var(--text-secondary);
    margin-top: 3px;
    text-transform: none;
    letter-spacing: 0;
  }
</style>
</head>
<body>

<div class="design-label">
  DESIGN 2 — CARTOGRAPHE
  <span>Warm parchment, engraved textures, explorer aesthetic</span>
</div>

<nav class="nav">
  <div class="nav-logo">Frise Série</div>
  <div class="nav-eras">
    <button class="era-pill active">Antiquité</button>
    <button class="era-pill">Moyen Âge</button>
    <button class="era-pill">Renaissance</button>
    <button class="era-pill">Ép. Moderne</button>
    <button class="era-pill">Révolutions</button>
    <button class="era-pill">XIXe siècle</button>
    <button class="era-pill">Guerres</button>
    <button class="era-pill">Guerre froide</button>
    <button class="era-pill">Contemporain</button>
  </div>
  <div class="nav-actions">
    <button class="nav-btn">Filtres</button>
    <button class="locale-switch">FR</button>
  </div>
</nav>

<div class="timeline-viewport" id="viewport">
  <div class="timeline-canvas">

    <div class="era-bg-layer" id="bgLayer">
      <div class="era-bg" style="width:1200px; background: linear-gradient(to right, rgba(180,120,60,0.08), rgba(200,160,80,0.05), rgba(180,120,60,0.08));">
        <div class="era-bg-title">Antiquité</div>
      </div>
      <div class="era-bg" style="width:1400px; background: linear-gradient(to right, rgba(80,90,120,0.06), rgba(100,80,110,0.05), rgba(80,90,120,0.06));">
        <div class="era-bg-title">Moyen Âge</div>
      </div>
      <div class="era-bg" style="width:800px; background: linear-gradient(to right, rgba(180,140,40,0.08), rgba(200,170,80,0.06), rgba(180,140,40,0.08));">
        <div class="era-bg-title">Renaissance</div>
      </div>
      <div class="era-bg" style="width:900px; background: linear-gradient(to right, rgba(60,100,100,0.06), rgba(80,60,100,0.05), rgba(60,100,100,0.06));">
        <div class="era-bg-title">Ép. Moderne</div>
      </div>
      <div class="era-bg" style="width:500px; background: linear-gradient(to right, rgba(160,50,40,0.06), rgba(180,60,50,0.04), rgba(160,50,40,0.06));">
        <div class="era-bg-title">Révolutions</div>
      </div>
      <div class="era-bg" style="width:700px; background: linear-gradient(to right, rgba(80,80,100,0.06), rgba(90,80,100,0.04), rgba(80,80,100,0.06));">
        <div class="era-bg-title">XIXe Siècle</div>
      </div>
      <div class="era-bg" style="width:600px; background: linear-gradient(to right, rgba(60,60,60,0.06), rgba(80,60,60,0.04), rgba(60,60,60,0.06));">
        <div class="era-bg-title">Guerres</div>
      </div>
      <div class="era-bg" style="width:800px; background: linear-gradient(to right, rgba(50,60,90,0.06), rgba(60,80,100,0.04), rgba(50,60,90,0.06));">
        <div class="era-bg-title">Guerre Froide</div>
      </div>
      <div class="era-bg" style="width:1100px; background: linear-gradient(to right, rgba(50,70,80,0.05), rgba(60,80,90,0.03), rgba(50,70,80,0.05));">
        <div class="era-bg-title">Contemporain</div>
      </div>
    </div>

    <div class="axis-layer" id="axisLayer">
      <div class="axis-line"></div>
    </div>

    <div class="cards-layer" id="cardsLayer"></div>

  </div>
</div>

<div class="sheet-backdrop" id="backdrop"></div>
<div class="bottom-sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-content" id="sheetContent"></div>
</div>

<script>
const shows = [
  { title:"Spartacus", years:"73 av. J.-C.", start:-73, end:-71, stars:3, platform:"Prime Video", pos:200 },
  { title:"Rome", years:"52 – 44 av. J.-C.", start:-52, end:-44, stars:4, platform:"Max", pos:400 },
  { title:"Vikings", years:"793 – 1002", start:793, end:1002, stars:4, platform:"Netflix", pos:1500 },
  { title:"The Last Kingdom", years:"866 – 950", start:866, end:950, stars:4, platform:"Netflix", pos:1700 },
  { title:"Knightfall", years:"1306 – 1314", start:1306, end:1314, stars:3, platform:"Netflix", pos:2100 },
  { title:"Marco Polo", years:"1271 – 1300", start:1271, end:1300, stars:3, platform:"Netflix", pos:1950 },
  { title:"Les Borgia", years:"1492 – 1507", start:1492, end:1507, stars:4, platform:"Canal+", pos:2700 },
  { title:"Les Tudors", years:"1509 – 1547", start:1509, end:1547, stars:4, platform:"Prime Video", pos:2900 },
  { title:"Reign", years:"1557 – 1567", start:1557, end:1567, stars:2, platform:"Netflix", pos:3100 },
  { title:"Versailles", years:"1667 – 1715", start:1667, end:1715, stars:4, platform:"Canal+", pos:3500 },
  { title:"Black Sails", years:"1715 – 1725", start:1715, end:1725, stars:4, platform:"Prime Video", pos:3800 },
  { title:"Turn", years:"1776 – 1783", start:1776, end:1783, stars:3, platform:"Prime Video", pos:4300 },
  { title:"Les Misérables", years:"1815 – 1832", start:1815, end:1832, stars:4, platform:"Arte", pos:4700 },
  { title:"Peaky Blinders", years:"1919 – 1934", start:1919, end:1934, stars:4, platform:"Netflix", pos:5200 },
  { title:"Band of Brothers", years:"1944", start:1944, end:1945, stars:5, platform:"Max", pos:5800 },
  { title:"Shogun", years:"1600", start:1600, end:1600, stars:5, platform:"Disney+", pos:3350 },
];

const events = [
  { year:-3000, label:"Début de l'Antiquité", pos:50 },
  { year:-52, label:"Guerre des Gaules", pos:380 },
  { year:476, label:"Chute de Rome", pos:1200 },
  { year:1066, label:"Conquête normande", pos:1850 },
  { year:1453, label:"Chute de Constantinople", pos:2600 },
  { year:1789, label:"Révolution française", pos:4200 },
  { year:1914, label:"Début WWI", pos:5100 },
  { year:1945, label:"Fin WWII", pos:5900 },
  { year:1991, label:"Fin Guerre froide", pos:6700 },
];

const ticks = [];
for (let y = -3000; y <= 2025; y += 100) {
  ticks.push({ year: y, pos: Math.round(((y + 3000) / 5025) * 8000) });
}

const axisLayer = document.getElementById('axisLayer');
ticks.forEach(t => {
  const tick = document.createElement('div');
  tick.className = 'axis-tick';
  tick.style.left = t.pos + 'px';
  const label = t.year < 0 ? Math.abs(t.year) + ' av. J.-C.' : t.year.toString();
  tick.innerHTML = `<div class="axis-tick-mark"></div><div class="axis-tick-label">${label}</div>`;
  axisLayer.appendChild(tick);
});

events.forEach(e => {
  const ev = document.createElement('div');
  ev.className = 'axis-event';
  ev.style.left = e.pos + 'px';
  ev.innerHTML = `<div class="axis-event-marker"></div><div class="axis-event-tooltip">${e.label} (${e.year < 0 ? Math.abs(e.year)+' av. J.-C.' : e.year})</div>`;
  axisLayer.appendChild(ev);
});

const cardsLayer = document.getElementById('cardsLayer');
const lanes = [];
shows.forEach((s, i) => {
  let lane = 0;
  for (let l = 0; l < lanes.length; l++) {
    if (s.pos - lanes[l] >= 156) { lane = l; break; }
    lane = l + 1;
  }
  lanes[lane] = s.pos;

  const card = document.createElement('div');
  card.className = 'show-card';
  card.style.left = s.pos + 'px';
  card.style.top = (lane * 280) + 'px';
  card.dataset.index = i;

  const starsStr = '★'.repeat(s.stars) + '☆'.repeat(5 - s.stars);
  card.innerHTML = `
    <div class="card-poster"><div class="card-poster-placeholder">${s.title[0]}</div></div>
    <div class="card-info">
      <div class="card-title">${s.title}</div>
      <div class="card-years">${s.years}</div>
      <div class="card-stars">${starsStr}</div>
      <span class="card-platform">${s.platform}</span>
    </div>
  `;
  card.addEventListener('click', () => openSheet(s));
  cardsLayer.appendChild(card);
});

const sheet = document.getElementById('sheet');
const backdrop = document.getElementById('backdrop');
const sheetContent = document.getElementById('sheetContent');

function openSheet(s) {
  const starsStr = '★'.repeat(s.stars) + '☆'.repeat(5 - s.stars);
  sheetContent.innerHTML = `
    <div class="sheet-poster">${s.title[0]}</div>
    <div class="sheet-details">
      <div class="sheet-title">${s.title}</div>
      <div class="sheet-meta">${s.years} · ${starsStr} Fiabilité historique</div>
      <div class="sheet-synopsis">Synopsis historique de la série ${s.title}. Cette série explore les événements de l'époque avec un regard dramatique sur les personnages et les conflits qui ont marqué cette période de l'histoire.</div>
      <div class="sheet-platforms">
        <button class="sheet-platform-btn">▶ ${s.platform}</button>
        <button class="sheet-platform-btn">Copier le lien</button>
        <button class="sheet-platform-btn">Wikipedia ↗</button>
      </div>
    </div>
  `;
  sheet.classList.add('open');
  backdrop.classList.add('visible');
}

backdrop.addEventListener('click', () => {
  sheet.classList.remove('open');
  backdrop.classList.remove('visible');
});

const viewport = document.getElementById('viewport');
const bgLayer = document.getElementById('bgLayer');
viewport.addEventListener('scroll', () => {
  bgLayer.style.transform = `translateX(${-viewport.scrollLeft * 0.3}px)`;
}, { passive: true });

viewport.addEventListener('wheel', (e) => {
  if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
    e.preventDefault();
    viewport.scrollLeft += e.deltaY;
  }
}, { passive: false });
</script>
</body>
</html>
