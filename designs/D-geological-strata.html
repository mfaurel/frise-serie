<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frise Série — Strates Géologiques</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;600;700&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  /* ── Reset & Base ───────────────────────────────────────────── */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Work Sans', sans-serif;
    background: #1a1612;
    color: #e8e0d4;
    overflow-x: hidden;
    min-height: 100vh;
  }

  /* ── Particle Canvas ────────────────────────────────────────── */
  #dust-canvas {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 1000;
  }

  /* ── Depth Meter (right rail) ───────────────────────────────── */
  .depth-meter {
    position: fixed;
    right: 18px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 900;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .depth-meter__track {
    width: 4px;
    height: 320px;
    background: rgba(255,255,255,.12);
    border-radius: 2px;
    position: relative;
  }
  .depth-meter__fill {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    background: linear-gradient(180deg, #c9a96e, #7a5c3a);
    border-radius: 2px;
    transition: height .3s ease;
  }
  .depth-meter__label {
    font-family: 'Work Sans', sans-serif;
    font-size: 10px;
    font-weight: 500;
    color: #c9a96e;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    letter-spacing: .5px;
    margin-top: 8px;
  }
  .depth-meter__icon {
    width: 22px; height: 22px;
    margin-bottom: 6px;
    fill: #c9a96e;
  }

  /* ── Time Axis (left rail) ──────────────────────────────────── */
  .time-axis {
    position: fixed;
    left: 0; top: 0; bottom: 0;
    width: 62px;
    z-index: 800;
    display: flex;
    flex-direction: column;
    pointer-events: none;
  }
  .time-axis__line {
    position: fixed;
    left: 31px; top: 0; bottom: 0;
    width: 2px;
    background: linear-gradient(180deg,
      rgba(201,169,110,.5),
      rgba(201,169,110,.15) 50%,
      rgba(201,169,110,.5));
  }
  .time-axis__tick {
    position: absolute;
    left: 8px;
    font-family: 'Work Sans', sans-serif;
    font-size: 10px;
    font-weight: 400;
    color: rgba(201,169,110,.7);
    white-space: nowrap;
  }

  /* ── Strata Container ───────────────────────────────────────── */
  .strata {
    position: relative;
    margin-left: 62px;
    margin-right: 60px;
  }

  /* ── Individual Stratum ─────────────────────────────────────── */
  .stratum {
    position: relative;
    min-height: 520px;
    padding: 60px 48px 80px;
    overflow: hidden;
  }
  .stratum::before {
    content: '';
    position: absolute; inset: 0;
    pointer-events: none;
    z-index: 1;
  }
  .stratum__header {
    position: relative;
    z-index: 5;
    margin-bottom: 40px;
  }
  .stratum__era {
    font-family: 'Bitter', serif;
    font-size: 36px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: var(--era-title);
    text-shadow: 0 2px 8px rgba(0,0,0,.5);
  }
  .stratum__dates {
    font-size: 13px;
    font-weight: 300;
    color: var(--era-sub);
    margin-top: 4px;
    letter-spacing: 1px;
  }
  .stratum__crack {
    position: absolute;
    left: 0; right: 0;
    height: 8px;
    bottom: -4px;
    z-index: 10;
    background: linear-gradient(90deg,
      transparent 5%,
      rgba(0,0,0,.6) 15%,
      transparent 25%,
      rgba(0,0,0,.4) 40%,
      transparent 55%,
      rgba(0,0,0,.5) 70%,
      transparent 85%);
    filter: blur(.5px);
  }
  .stratum__grid {
    position: relative;
    z-index: 5;
    display: flex;
    flex-wrap: wrap;
    gap: 32px;
    justify-content: flex-start;
  }

  /* ── Geological Textures ────────────────────────────────────── */
  /* Concrete (surface — Guerres Mondiales) */
  .stratum--concrete {
    --era-title: #d4cfc7;
    --era-sub: rgba(212,207,199,.6);
    background:
      repeating-linear-gradient(0deg,
        transparent, transparent 3px,
        rgba(255,255,255,.03) 3px, rgba(255,255,255,.03) 4px),
      repeating-linear-gradient(90deg,
        transparent, transparent 7px,
        rgba(0,0,0,.04) 7px, rgba(0,0,0,.04) 8px),
      linear-gradient(180deg, #6b6560, #5a5550);
  }
  .stratum--concrete::before {
    background:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,.04) 1px, transparent 1px),
      radial-gradient(circle at 80% 70%, rgba(0,0,0,.06) 1px, transparent 1px);
    background-size: 12px 12px, 18px 18px;
  }

  /* Coal (Révolutions) */
  .stratum--coal {
    --era-title: #e8d5a3;
    --era-sub: rgba(232,213,163,.55);
    background:
      repeating-linear-gradient(175deg,
        transparent, transparent 6px,
        rgba(0,0,0,.15) 6px, rgba(0,0,0,.15) 7px),
      linear-gradient(180deg, #3d3530, #2e2824);
  }
  .stratum--coal::before {
    background:
      radial-gradient(ellipse at 30% 50%, rgba(60,45,30,.4) 0%, transparent 60%),
      radial-gradient(circle at 70% 30%, rgba(80,60,40,.2) 0%, transparent 40%);
  }

  /* Sandstone (Epoque Moderne) */
  .stratum--sandstone {
    --era-title: #f0dbb8;
    --era-sub: rgba(240,219,184,.6);
    background:
      repeating-linear-gradient(2deg,
        transparent, transparent 4px,
        rgba(180,140,80,.08) 4px, rgba(180,140,80,.08) 5px),
      repeating-linear-gradient(178deg,
        transparent, transparent 8px,
        rgba(160,120,60,.06) 8px, rgba(160,120,60,.06) 9px),
      linear-gradient(180deg, #8a7354, #7a6344);
  }
  .stratum--sandstone::before {
    background:
      radial-gradient(circle at 15% 25%, rgba(200,170,110,.15) 0%, transparent 50%),
      radial-gradient(circle at 85% 75%, rgba(120,90,50,.15) 0%, transparent 50%);
  }

  /* Limestone (Renaissance) */
  .stratum--limestone {
    --era-title: #f5edd8;
    --era-sub: rgba(245,237,216,.55);
    background:
      repeating-linear-gradient(185deg,
        transparent, transparent 12px,
        rgba(255,255,255,.04) 12px, rgba(255,255,255,.04) 13px),
      repeating-linear-gradient(92deg,
        transparent, transparent 20px,
        rgba(200,180,140,.06) 20px, rgba(200,180,140,.06) 22px),
      linear-gradient(180deg, #9e9080, #887868);
  }
  .stratum--limestone::before {
    background:
      radial-gradient(ellipse at 40% 60%, rgba(255,240,200,.06) 0%, transparent 70%);
  }

  /* Slate (Moyen Age) */
  .stratum--slate {
    --era-title: #c8d0d8;
    --era-sub: rgba(200,208,216,.5);
    background:
      repeating-linear-gradient(176deg,
        transparent, transparent 3px,
        rgba(100,120,140,.1) 3px, rgba(100,120,140,.1) 4px),
      repeating-linear-gradient(4deg,
        transparent, transparent 5px,
        rgba(80,100,120,.06) 5px, rgba(80,100,120,.06) 6px),
      linear-gradient(180deg, #52585e, #42484e);
  }
  .stratum--slate::before {
    background:
      repeating-linear-gradient(170deg,
        transparent, transparent 30px,
        rgba(255,255,255,.02) 30px, rgba(255,255,255,.02) 31px);
  }

  /* Granite (Antiquite — deepest) */
  .stratum--granite {
    --era-title: #d4c8b8;
    --era-sub: rgba(212,200,184,.5);
    background:
      radial-gradient(circle at 20% 40%, rgba(140,120,100,.3) 1px, transparent 2px),
      radial-gradient(circle at 60% 20%, rgba(100,80,60,.2) 1px, transparent 2px),
      radial-gradient(circle at 80% 70%, rgba(160,140,110,.2) 1px, transparent 3px),
      radial-gradient(circle at 40% 80%, rgba(90,70,50,.3) 1px, transparent 2px),
      linear-gradient(180deg, #3a3028, #2a201a);
    background-size: 8px 8px, 12px 12px, 10px 10px, 14px 14px, 100% 100%;
  }
  .stratum--granite::before {
    background:
      radial-gradient(ellipse at 50% 50%, rgba(80,60,40,.2) 0%, transparent 70%);
  }

  /* ── Show Card ──────────────────────────────────────────────── */
  .card {
    position: relative;
    width: 220px;
    background: rgba(30,25,20,.75);
    border: 1px solid rgba(180,160,120,.25);
    border-radius: 3px;
    padding: 14px;
    cursor: pointer;
    transition: transform .4s cubic-bezier(.23,1,.32,1), box-shadow .4s ease;
    box-shadow:
      inset 0 0 20px rgba(0,0,0,.3),
      0 4px 16px rgba(0,0,0,.4),
      0 1px 3px rgba(0,0,0,.3);
    z-index: 5;
  }
  .card::before {
    content: '';
    position: absolute; inset: -3px;
    border: 2px solid rgba(140,120,80,.15);
    border-radius: 5px;
    pointer-events: none;
  }
  .card:hover {
    transform: translateY(-6px) rotate(0deg) !important;
    box-shadow:
      inset 0 0 20px rgba(0,0,0,.2),
      0 12px 32px rgba(0,0,0,.5),
      0 2px 8px rgba(180,160,120,.15);
    z-index: 20;
  }
  .card__poster {
    width: 100%;
    height: 130px;
    border-radius: 2px;
    margin-bottom: 12px;
    position: relative;
    overflow: hidden;
  }
  .card__poster-inner {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bitter', serif;
    font-size: 14px;
    font-weight: 600;
    text-align: center;
    padding: 12px;
    line-height: 1.3;
    filter: sepia(.35) contrast(.9) brightness(.85);
  }
  .card__poster::after {
    content: '';
    position: absolute; inset: 0;
    background:
      repeating-linear-gradient(0deg,
        transparent, transparent 2px,
        rgba(0,0,0,.03) 2px, rgba(0,0,0,.03) 3px),
      radial-gradient(ellipse at 50% 50%,
        transparent 50%, rgba(0,0,0,.15) 100%);
    pointer-events: none;
  }
  .card__title {
    font-family: 'Bitter', serif;
    font-size: 15px;
    font-weight: 600;
    color: #ede4d4;
    margin-bottom: 6px;
    line-height: 1.2;
  }
  .card__date {
    font-size: 12px;
    font-weight: 300;
    color: rgba(200,180,140,.7);
    margin-bottom: 6px;
  }
  .card__meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .card__stars {
    font-size: 12px;
    color: #c9a96e;
    letter-spacing: 1px;
  }
  .card__platform {
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: .5px;
    padding: 2px 7px;
    border-radius: 2px;
    background: rgba(180,160,120,.12);
    color: rgba(200,180,140,.8);
  }

  /* ── Expanded Card Overlay ──────────────────────────────────── */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(10,8,6,.85);
    z-index: 2000;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity .35s ease;
    backdrop-filter: blur(6px);
  }
  .overlay.active {
    opacity: 1;
    pointer-events: auto;
  }
  .overlay__card {
    background: #1e1914;
    border: 1px solid rgba(180,160,120,.3);
    border-radius: 6px;
    padding: 36px;
    max-width: 440px;
    width: 90%;
    transform: translateY(40px) scale(.92);
    transition: transform .45s cubic-bezier(.23,1,.32,1);
    box-shadow: 0 24px 80px rgba(0,0,0,.6);
    position: relative;
  }
  .overlay.active .overlay__card {
    transform: translateY(0) scale(1);
  }
  .overlay__close {
    position: absolute;
    top: 12px; right: 14px;
    background: none; border: none;
    color: rgba(200,180,140,.6);
    font-size: 22px;
    cursor: pointer;
    line-height: 1;
    transition: color .2s;
  }
  .overlay__close:hover { color: #ede4d4; }
  .overlay__poster {
    width: 100%;
    height: 200px;
    border-radius: 4px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .overlay__poster-inner {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bitter', serif;
    font-size: 22px;
    font-weight: 700;
    text-align: center;
    padding: 20px;
    filter: sepia(.25) contrast(.95) brightness(.9);
  }
  .overlay__title {
    font-family: 'Bitter', serif;
    font-size: 26px;
    font-weight: 700;
    color: #ede4d4;
    margin-bottom: 8px;
  }
  .overlay__date {
    font-size: 14px;
    color: rgba(200,180,140,.7);
    margin-bottom: 12px;
  }
  .overlay__stars {
    font-size: 18px;
    color: #c9a96e;
    letter-spacing: 2px;
    margin-bottom: 8px;
  }
  .overlay__platform {
    display: inline-block;
    font-size: 12px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 4px 12px;
    border-radius: 3px;
    background: rgba(180,160,120,.15);
    color: rgba(200,180,140,.9);
    margin-bottom: 16px;
  }
  .overlay__era {
    font-size: 13px;
    color: rgba(200,180,140,.5);
    font-style: italic;
  }

  /* ── Dust Burst (card click) ────────────────────────────────── */
  .dust-burst {
    position: fixed;
    pointer-events: none;
    z-index: 1500;
  }
  .dust-burst__particle {
    position: absolute;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: rgba(180,160,120,.6);
    animation: dustFloat 1s ease-out forwards;
  }
  @keyframes dustFloat {
    0%   { opacity: 1; transform: translate(0, 0) scale(1); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0); }
  }

  /* ── Header ─────────────────────────────────────────────────── */
  .hero {
    position: relative;
    padding: 80px 48px 40px;
    margin-left: 62px;
    margin-right: 60px;
    text-align: center;
    background: linear-gradient(180deg,
      #1a1612 0%, #2a231c 60%, #3d3228 100%);
  }
  .hero__title {
    font-family: 'Bitter', serif;
    font-size: 48px;
    font-weight: 700;
    color: #ede4d4;
    letter-spacing: 2px;
    margin-bottom: 12px;
  }
  .hero__sub {
    font-size: 16px;
    font-weight: 300;
    color: rgba(200,180,140,.6);
    letter-spacing: 1px;
    max-width: 500px;
    margin: 0 auto 24px;
  }
  .hero__arrow {
    display: inline-block;
    animation: bounce 2s ease-in-out infinite;
    font-size: 28px;
    color: rgba(201,169,110,.5);
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(10px); }
  }

  /* ── Bottom Bedrock ─────────────────────────────────────────── */
  .bedrock {
    margin-left: 62px;
    margin-right: 60px;
    padding: 80px 48px;
    text-align: center;
    background:
      radial-gradient(circle at 30% 40%, rgba(40,30,20,.5) 1px, transparent 2px),
      radial-gradient(circle at 70% 60%, rgba(30,20,10,.4) 1px, transparent 2px),
      linear-gradient(180deg, #1e1610, #0e0a08);
    background-size: 6px 6px, 10px 10px, 100% 100%;
  }
  .bedrock__text {
    font-family: 'Bitter', serif;
    font-size: 18px;
    color: rgba(200,180,140,.3);
    letter-spacing: 2px;
  }

  /* ── Scroll Progress Bar ────────────────────────────────────── */
  .scroll-progress {
    position: fixed;
    top: 0; left: 0;
    height: 3px;
    background: linear-gradient(90deg, #7a5c3a, #c9a96e);
    z-index: 3000;
    transition: width .1s linear;
  }
</style>
</head>
<body>

<div class="scroll-progress" id="scrollProgress"></div>
<canvas id="dust-canvas"></canvas>

<!-- Depth Meter -->
<nav class="depth-meter" id="depthMeter">
  <svg class="depth-meter__icon" viewBox="0 0 24 24">
    <path d="M12 2L8 8h3v6H8l4 6 4-6h-3V8h3L12 2z"/>
  </svg>
  <div class="depth-meter__track">
    <div class="depth-meter__fill" id="depthFill"></div>
  </div>
  <div class="depth-meter__label" id="depthLabel">Surface</div>
</nav>

<!-- Time Axis -->
<div class="time-axis">
  <div class="time-axis__line"></div>
</div>

<!-- Overlay -->
<div class="overlay" id="overlay">
  <div class="overlay__card">
    <button class="overlay__close" id="overlayClose">&times;</button>
    <div class="overlay__poster">
      <div class="overlay__poster-inner" id="overlayPoster"></div>
    </div>
    <div class="overlay__title" id="overlayTitle"></div>
    <div class="overlay__date" id="overlayDate"></div>
    <div class="overlay__stars" id="overlayStars"></div>
    <div class="overlay__platform" id="overlayPlatform"></div>
    <div class="overlay__era" id="overlayEra"></div>
  </div>
</div>

<!-- Hero -->
<header class="hero">
  <h1 class="hero__title">Strates Temporelles</h1>
  <p class="hero__sub">Creusez les couches du temps pour exhumer les grandes sagas historiques</p>
  <div class="hero__arrow">&#8675;</div>
</header>

<!-- Strata -->
<main class="strata" id="strata"></main>

<!-- Bedrock -->
<footer class="bedrock">
  <p class="bedrock__text">&#9670; Socle Rocheux &mdash; Avant l&rsquo;Histoire &#9670;</p>
</footer>

<script>
/* ══════════════════════════════════════════════════════════════
   DATA
   ══════════════════════════════════════════════════════════════ */
const ERAS = [
  {
    id: 'guerres',
    name: 'Guerres Mondiales',
    dateRange: '1914 – 1945',
    texture: 'concrete',
    posterBg: 'linear-gradient(135deg, #5a5550, #3e3b38)',
    shows: [
      { title: 'Peaky Blinders', dates: '1919 – 1934', stars: 4, platform: 'Netflix' },
      { title: 'Band of Brothers', dates: '1944', stars: 5, platform: 'Max' },
    ]
  },
  {
    id: 'revolutions',
    name: 'Révolutions',
    dateRange: '1750 – 1900',
    texture: 'coal',
    posterBg: 'linear-gradient(135deg, #3d3530, #28221e)',
    shows: [
      { title: 'Turn', dates: '1776 – 1783', stars: 3, platform: 'Prime Video' },
      { title: 'Les Misérables', dates: '1815 – 1832', stars: 4, platform: 'Arte' },
    ]
  },
  {
    id: 'moderne',
    name: 'Époque Moderne',
    dateRange: '1500 – 1750',
    texture: 'sandstone',
    posterBg: 'linear-gradient(135deg, #8a7354, #5e4d38)',
    shows: [
      { title: 'Versailles', dates: '1667 – 1715', stars: 4, platform: 'Canal+' },
      { title: 'Black Sails', dates: '1715 – 1725', stars: 4, platform: 'Prime Video' },
      { title: 'Shōgun', dates: '1600', stars: 5, platform: 'Disney+' },
    ]
  },
  {
    id: 'renaissance',
    name: 'Renaissance',
    dateRange: '1400 – 1600',
    texture: 'limestone',
    posterBg: 'linear-gradient(135deg, #9e9080, #6e6254)',
    shows: [
      { title: 'Les Borgia', dates: '1492 – 1507', stars: 4, platform: 'Canal+' },
      { title: 'Les Tudors', dates: '1509 – 1547', stars: 4, platform: 'Prime Video' },
      { title: 'Reign', dates: '1557 – 1567', stars: 2, platform: 'Netflix' },
    ]
  },
  {
    id: 'moyen-age',
    name: 'Moyen Âge',
    dateRange: '500 – 1400',
    texture: 'slate',
    posterBg: 'linear-gradient(135deg, #52585e, #363b40)',
    shows: [
      { title: 'Vikings', dates: '793 – 1002', stars: 4, platform: 'Netflix' },
      { title: 'The Last Kingdom', dates: '866 – 950', stars: 4, platform: 'Netflix' },
      { title: 'Knightfall', dates: '1306 – 1314', stars: 3, platform: 'Netflix' },
      { title: 'Marco Polo', dates: '1271 – 1300', stars: 3, platform: 'Netflix' },
    ]
  },
  {
    id: 'antiquite',
    name: 'Antiquité',
    dateRange: '3000 av. J.-C. – 500',
    texture: 'granite',
    posterBg: 'linear-gradient(135deg, #3a3028, #1e1610)',
    shows: [
      { title: 'Spartacus', dates: '73 av. J.-C.', stars: 3, platform: 'Prime Video' },
      { title: 'Rome', dates: '52 – 44 av. J.-C.', stars: 4, platform: 'Max' },
    ]
  },
];

/* ══════════════════════════════════════════════════════════════
   RENDER STRATA
   ══════════════════════════════════════════════════════════════ */
const strataEl = document.getElementById('strata');

function starString(n) {
  return '★'.repeat(n) + '☆'.repeat(5 - n);
}

// Seeded pseudo-random for consistent card rotations
function seededRand(seed) {
  let x = Math.sin(seed) * 10000;
  return x - Math.floor(x);
}

ERAS.forEach((era, eraIdx) => {
  const section = document.createElement('section');
  section.className = `stratum stratum--${era.texture}`;
  section.dataset.era = era.name;
  section.id = `era-${era.id}`;

  let cardsHTML = '';
  era.shows.forEach((show, i) => {
    const seed = eraIdx * 10 + i + 1;
    const rotation = (seededRand(seed) * 4 - 2).toFixed(1);

    cardsHTML += `
      <div class="card" style="transform: rotate(${rotation}deg)"
           data-title="${show.title}"
           data-dates="${show.dates}"
           data-stars="${show.stars}"
           data-platform="${show.platform}"
           data-era="${era.name}"
           data-bg="${era.posterBg}">
        <div class="card__poster">
          <div class="card__poster-inner" style="background: ${era.posterBg}; color: rgba(237,228,212,.7);">
            ${show.title}
          </div>
        </div>
        <div class="card__title">${show.title}</div>
        <div class="card__date">${show.dates}</div>
        <div class="card__meta">
          <span class="card__stars">${starString(show.stars)}</span>
          <span class="card__platform">${show.platform}</span>
        </div>
      </div>`;
  });

  section.innerHTML = `
    <div class="stratum__header">
      <h2 class="stratum__era">${era.name}</h2>
      <div class="stratum__dates">${era.dateRange}</div>
    </div>
    <div class="stratum__grid">${cardsHTML}</div>
    <div class="stratum__crack"></div>`;

  strataEl.appendChild(section);
});

/* ══════════════════════════════════════════════════════════════
   CARD CLICK → UNEARTH OVERLAY
   ══════════════════════════════════════════════════════════════ */
const overlay      = document.getElementById('overlay');
const overlayClose = document.getElementById('overlayClose');

function spawnDustBurst(x, y) {
  const burst = document.createElement('div');
  burst.className = 'dust-burst';
  burst.style.left = x + 'px';
  burst.style.top  = y + 'px';
  const count = 18;
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'dust-burst__particle';
    const angle = (Math.PI * 2 / count) * i + (Math.random() - .5) * .5;
    const dist  = 40 + Math.random() * 60;
    p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
    p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
    p.style.width  = (2 + Math.random() * 4) + 'px';
    p.style.height = p.style.width;
    p.style.left   = (Math.random() * 10 - 5) + 'px';
    p.style.top    = (Math.random() * 10 - 5) + 'px';
    burst.appendChild(p);
  }
  document.body.appendChild(burst);
  setTimeout(() => burst.remove(), 1100);
}

document.querySelectorAll('.card').forEach(card => {
  card.addEventListener('click', (e) => {
    const rect = card.getBoundingClientRect();
    spawnDustBurst(rect.left + rect.width / 2, rect.top + rect.height / 2);

    document.getElementById('overlayTitle').textContent    = card.dataset.title;
    document.getElementById('overlayDate').textContent     = card.dataset.dates;
    document.getElementById('overlayStars').textContent    = starString(+card.dataset.stars);
    document.getElementById('overlayPlatform').textContent = card.dataset.platform;
    document.getElementById('overlayEra').textContent      = 'Strate : ' + card.dataset.era;

    const posterInner = document.getElementById('overlayPoster');
    posterInner.style.background = card.dataset.bg;
    posterInner.style.color = 'rgba(237,228,212,.7)';
    posterInner.textContent = card.dataset.title;

    setTimeout(() => overlay.classList.add('active'), 50);
  });
});

overlayClose.addEventListener('click', () => overlay.classList.remove('active'));
overlay.addEventListener('click', (e) => {
  if (e.target === overlay) overlay.classList.remove('active');
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') overlay.classList.remove('active');
});

/* ══════════════════════════════════════════════════════════════
   DEPTH METER + SCROLL PROGRESS
   ══════════════════════════════════════════════════════════════ */
const depthFill  = document.getElementById('depthFill');
const depthLabel = document.getElementById('depthLabel');
const progressEl = document.getElementById('scrollProgress');

const eraLabels = ERAS.map(e => e.name);
eraLabels.unshift('Surface');

function updateDepthMeter() {
  const scrollTop   = window.scrollY;
  const docHeight   = document.documentElement.scrollHeight - window.innerHeight;
  const pct         = Math.min(scrollTop / docHeight, 1);
  depthFill.style.height = (pct * 100) + '%';
  progressEl.style.width = (pct * 100) + '%';

  // Determine current era
  const sections = document.querySelectorAll('.stratum');
  let currentEra = 'Surface';
  sections.forEach(s => {
    const rect = s.getBoundingClientRect();
    if (rect.top < window.innerHeight * 0.5) {
      currentEra = s.dataset.era;
    }
  });
  depthLabel.textContent = currentEra;
}
window.addEventListener('scroll', updateDepthMeter, { passive: true });
updateDepthMeter();

/* ══════════════════════════════════════════════════════════════
   TIME AXIS TICKS
   ══════════════════════════════════════════════════════════════ */
function placeTimeTicks() {
  const existing = document.querySelectorAll('.time-axis__tick');
  existing.forEach(el => el.remove());

  const axis = document.querySelector('.time-axis');
  const sections = document.querySelectorAll('.stratum');

  sections.forEach(section => {
    const rect    = section.getBoundingClientRect();
    const absTop  = rect.top + window.scrollY;
    const eraData = ERAS.find(e => e.name === section.dataset.era);
    if (!eraData) return;

    const tick = document.createElement('div');
    tick.className = 'time-axis__tick';
    tick.textContent = eraData.dateRange;
    tick.style.top = absTop + 60 + 'px';
    axis.appendChild(tick);
  });
}
placeTimeTicks();
window.addEventListener('resize', placeTimeTicks);

/* ══════════════════════════════════════════════════════════════
   DUST PARTICLES (ambient scroll)
   ══════════════════════════════════════════════════════════════ */
const canvas = document.getElementById('dust-canvas');
const ctx    = canvas.getContext('2d');
let particles = [];
let lastScrollY = 0;
let scrollDelta = 0;

function resizeCanvas() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

class Particle {
  constructor() {
    this.reset();
  }
  reset() {
    this.x  = Math.random() * canvas.width;
    this.y  = canvas.height + Math.random() * 20;
    this.vx = (Math.random() - .5) * .4;
    this.vy = -(1 + Math.random() * 2);
    this.r  = 1 + Math.random() * 2;
    this.life     = 1;
    this.decay    = .005 + Math.random() * .01;
    this.opacity  = .2 + Math.random() * .3;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;
    if (this.life <= 0) this.reset();
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(180,160,120,${this.life * this.opacity})`;
    ctx.fill();
  }
}

for (let i = 0; i < 40; i++) {
  const p = new Particle();
  p.y = Math.random() * canvas.height;
  p.life = Math.random();
  particles.push(p);
}

window.addEventListener('scroll', () => {
  scrollDelta = Math.abs(window.scrollY - lastScrollY);
  lastScrollY = window.scrollY;
}, { passive: true });

function animateParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Spawn extra particles when scrolling
  const spawnCount = Math.min(Math.floor(scrollDelta * 0.3), 6);
  for (let i = 0; i < spawnCount; i++) {
    const p = new Particle();
    p.y = Math.random() * canvas.height;
    particles.push(p);
  }

  // Cap particle count
  if (particles.length > 100) {
    particles = particles.slice(particles.length - 100);
  }

  scrollDelta *= .85;

  particles.forEach(p => {
    p.update();
    p.draw();
  });

  requestAnimationFrame(animateParticles);
}
animateParticles();

/* ══════════════════════════════════════════════════════════════
   INTERSECTION OBSERVER — cards fade in
   ══════════════════════════════════════════════════════════════ */
const cards = document.querySelectorAll('.card');
cards.forEach(c => {
  c.style.opacity = '0';
  c.style.transition = 'opacity .6s ease, transform .6s cubic-bezier(.23,1,.32,1)';
});

const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.style.opacity = '1';
      observer.unobserve(entry.target);
    }
  });
}, { threshold: 0.15 });

cards.forEach(c => observer.observe(c));
</script>
</body>
</html>
