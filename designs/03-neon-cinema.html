<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design 3 — Néon Cinéma</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Syne:wght@700;800&family=Fira+Code:wght@400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-void: #05050a;
    --bg-card: #0d0d18;
    --bg-panel: #111122;
    --text-bright: #f0f0f5;
    --text-dim: #6b6b8a;
    --accent-cyan: #00e5ff;
    --accent-magenta: #ff2d95;
    --accent-amber: #ffb300;
    --glow-cyan: rgba(0,229,255,0.15);
    --glow-magenta: rgba(255,45,149,0.12);
    --border-glow: rgba(0,229,255,0.12);
  }

  html { -webkit-font-smoothing: antialiased; }

  body {
    background: var(--bg-void);
    color: var(--text-bright);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    overflow: hidden;
    height: 100vh;
    /* Subtle grid pattern */
    background-image:
      linear-gradient(rgba(0,229,255,0.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.015) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  /* ── NAV ── */
  .nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 56px;
    background: rgba(5,5,10,0.85);
    backdrop-filter: blur(20px) saturate(1.5);
    -webkit-backdrop-filter: blur(20px) saturate(1.5);
    border-bottom: 1px solid var(--border-glow);
    display: flex;
    align-items: center;
    padding: 0 24px;
    z-index: 100;
    gap: 24px;
  }

  .nav-logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 18px;
    background: linear-gradient(135deg, var(--accent-cyan), var(--accent-magenta));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.5px;
    flex-shrink: 0;
    text-transform: uppercase;
  }

  .nav-eras {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    scrollbar-width: none;
    flex: 1;
  }
  .nav-eras::-webkit-scrollbar { display: none; }

  .era-pill {
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 500;
    white-space: nowrap;
    cursor: pointer;
    border: 1px solid transparent;
    color: var(--text-dim);
    background: transparent;
    font-family: inherit;
    transition: all 180ms cubic-bezier(0.2,0,0,1);
  }
  .era-pill:hover {
    color: var(--accent-cyan);
    background: var(--glow-cyan);
    border-color: rgba(0,229,255,0.2);
  }
  .era-pill.active {
    color: var(--accent-cyan);
    background: var(--glow-cyan);
    border-color: rgba(0,229,255,0.3);
    box-shadow: 0 0 12px rgba(0,229,255,0.15);
  }

  .nav-actions {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-shrink: 0;
  }

  .nav-btn {
    padding: 6px 16px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid var(--border-glow);
    color: var(--accent-cyan);
    background: rgba(0,229,255,0.04);
    font-family: inherit;
    transition: all 150ms;
  }
  .nav-btn:hover {
    background: var(--glow-cyan);
    box-shadow: 0 0 16px rgba(0,229,255,0.1);
  }

  .locale-switch {
    font-size: 11px;
    font-weight: 700;
    color: var(--accent-magenta);
    cursor: pointer;
    padding: 6px 10px;
    border: 1px solid rgba(255,45,149,0.2);
    border-radius: 6px;
    background: rgba(255,45,149,0.04);
    font-family: inherit;
  }

  /* ── TIMELINE ── */
  .timeline-viewport {
    position: fixed;
    top: 56px;
    left: 0; right: 0; bottom: 0;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: thin;
    scrollbar-color: rgba(0,229,255,0.3) transparent;
  }
  .timeline-viewport::-webkit-scrollbar { height: 4px; }
  .timeline-viewport::-webkit-scrollbar-thumb { background: rgba(0,229,255,0.4); border-radius: 2px; }

  .timeline-canvas {
    position: relative;
    width: 8000px;
    height: calc(100vh - 56px);
  }

  /* ── LAYER 1: ERA BACKGROUNDS ── */
  .era-bg-layer {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    display: flex;
    will-change: transform;
  }

  .era-bg {
    height: 100%;
    position: relative;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 80px;
    overflow: hidden;
  }

  .era-bg-title {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 80px;
    color: transparent;
    -webkit-text-stroke: 1px rgba(255,255,255,0.04);
    white-space: nowrap;
    text-transform: uppercase;
    letter-spacing: 6px;
    user-select: none;
    pointer-events: none;
  }

  /* Era-specific glowing accent strips */
  .era-bg::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0; right: 0;
    height: 3px;
    background: var(--era-color, var(--accent-cyan));
    opacity: 0.4;
    filter: blur(4px);
  }

  /* ── LAYER 2: TIME AXIS ── */
  .axis-layer {
    position: absolute;
    top: 60%;
    left: 0;
    height: 48px;
    width: 100%;
    will-change: transform;
  }

  .axis-line {
    position: absolute;
    top: 24px;
    left: 0; right: 0;
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(0,229,255,0.2), rgba(255,45,149,0.2), transparent);
  }

  .axis-tick {
    position: absolute;
    top: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .axis-tick-mark {
    width: 1px;
    height: 16px;
    background: rgba(0,229,255,0.3);
  }

  .axis-tick-label {
    font-family: 'Fira Code', monospace;
    font-size: 9px;
    color: var(--text-dim);
    margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }

  .axis-event {
    position: absolute;
    top: 4px;
  }

  .axis-event-pulse {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent-magenta);
    cursor: pointer;
    position: relative;
    transition: transform 200ms;
    box-shadow: 0 0 8px var(--glow-magenta);
  }
  .axis-event-pulse::before {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 1px solid var(--accent-magenta);
    opacity: 0.3;
    animation: pulse 2s ease-out infinite;
  }
  @keyframes pulse {
    0% { transform: scale(1); opacity: 0.3; }
    100% { transform: scale(2); opacity: 0; }
  }
  .axis-event-pulse:hover { transform: scale(1.3); }

  .axis-event-tooltip {
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    margin-bottom: 10px;
    padding: 8px 14px;
    background: var(--bg-panel);
    border: 1px solid var(--border-glow);
    border-radius: 8px;
    backdrop-filter: blur(12px);
    white-space: nowrap;
    font-size: 11px;
    color: var(--text-bright);
    opacity: 0;
    pointer-events: none;
    transition: opacity 200ms;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5), 0 0 12px var(--glow-cyan);
  }
  .axis-event:hover .axis-event-tooltip { opacity: 1; }

  /* ── LAYER 3: SHOW CARDS ── */
  .cards-layer {
    position: absolute;
    top: 66%;
    left: 0;
    width: 100%;
    height: 34%;
    display: flex;
    align-items: flex-start;
  }

  .show-card {
    position: absolute;
    width: 140px;
    cursor: pointer;
    transition: transform 200ms cubic-bezier(0.2,0,0,1);
  }
  .show-card:hover {
    transform: translateY(-10px) scale(1.06);
    z-index: 10;
  }

  .card-poster {
    width: 124px;
    height: 180px;
    border-radius: 8px;
    background: var(--bg-card);
    border: 1px solid rgba(0,229,255,0.08);
    overflow: hidden;
    margin: 0 auto;
    position: relative;
    transition: border-color 200ms, box-shadow 200ms;
  }
  .show-card:hover .card-poster {
    border-color: rgba(0,229,255,0.25);
    box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 20px var(--glow-cyan);
  }

  .card-poster-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Syne', sans-serif;
    font-size: 32px;
    font-weight: 800;
    background: linear-gradient(135deg, rgba(0,229,255,0.05), rgba(255,45,149,0.05));
    color: rgba(0,229,255,0.2);
  }

  .card-info {
    padding: 8px 4px 0;
    text-align: center;
  }

  .card-title {
    font-size: 12px;
    font-weight: 600;
    line-height: 1.3;
    text-wrap: balance;
    color: var(--text-bright);
    margin-bottom: 2px;
  }

  .card-years {
    font-family: 'Fira Code', monospace;
    font-size: 10px;
    color: var(--accent-cyan);
    font-variant-numeric: tabular-nums;
    margin-bottom: 4px;
  }

  .card-stars {
    color: var(--accent-amber);
    font-size: 10px;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }

  .card-platform {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 9px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    background: rgba(255,45,149,0.08);
    color: var(--accent-magenta);
    border: 1px solid rgba(255,45,149,0.15);
  }

  /* ── BOTTOM SHEET ── */
  .bottom-sheet {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 0;
    background: var(--bg-panel);
    border-top: 1px solid var(--border-glow);
    border-radius: 20px 20px 0 0;
    transition: height 400ms cubic-bezier(0.33, 1, 0.68, 1);
    z-index: 90;
    overflow: hidden;
    box-shadow: 0 -8px 40px rgba(0,229,255,0.05);
  }
  .bottom-sheet.open { height: 40vh; }

  .sheet-handle {
    width: 40px;
    height: 4px;
    background: rgba(0,229,255,0.3);
    border-radius: 2px;
    margin: 12px auto;
    cursor: grab;
  }

  .sheet-content {
    padding: 0 40px 40px;
    display: flex;
    gap: 32px;
    opacity: 0;
    transition: opacity 300ms 200ms;
  }
  .bottom-sheet.open .sheet-content { opacity: 1; }

  .sheet-poster {
    width: 160px;
    height: 240px;
    border-radius: 10px;
    background: var(--bg-card);
    border: 1px solid rgba(0,229,255,0.1);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Syne', sans-serif;
    font-size: 40px;
    font-weight: 800;
    color: rgba(0,229,255,0.15);
    background: linear-gradient(135deg, rgba(0,229,255,0.04), rgba(255,45,149,0.04));
  }

  .sheet-details { flex: 1; }

  .sheet-title {
    font-family: 'Syne', sans-serif;
    font-size: 28px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--text-bright), var(--accent-cyan));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 6px;
  }

  .sheet-meta {
    font-family: 'Fira Code', monospace;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 14px;
  }
  .sheet-meta .era-tag {
    color: var(--accent-cyan);
    border: 1px solid rgba(0,229,255,0.2);
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 10px;
    margin-left: 8px;
  }

  .sheet-synopsis {
    font-size: 14px;
    line-height: 1.6;
    color: var(--text-dim);
    max-width: 560px;
    margin-bottom: 18px;
  }

  .sheet-platforms { display: flex; gap: 10px; }

  .sheet-platform-btn {
    padding: 8px 20px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    background: rgba(0,229,255,0.06);
    color: var(--accent-cyan);
    border: 1px solid rgba(0,229,255,0.15);
    cursor: pointer;
    font-family: inherit;
    transition: all 150ms;
  }
  .sheet-platform-btn:hover {
    background: rgba(0,229,255,0.12);
    box-shadow: 0 0 16px var(--glow-cyan);
  }

  .sheet-platform-btn.magenta {
    color: var(--accent-magenta);
    background: rgba(255,45,149,0.06);
    border-color: rgba(255,45,149,0.15);
  }
  .sheet-platform-btn.magenta:hover {
    background: rgba(255,45,149,0.12);
    box-shadow: 0 0 16px var(--glow-magenta);
  }

  /* ── BACKDROP ── */
  .sheet-backdrop {
    position: fixed; inset: 0;
    background: rgba(5,5,10,0.7);
    z-index: 89;
    opacity: 0;
    pointer-events: none;
    transition: opacity 300ms;
  }
  .sheet-backdrop.visible { opacity: 1; pointer-events: auto; }

  /* ── DESIGN LABEL ── */
  .design-label {
    position: fixed;
    top: 68px; right: 24px;
    padding: 10px 18px;
    background: var(--bg-panel);
    border: 1px solid var(--border-glow);
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent-cyan);
    z-index: 101;
    box-shadow: 0 0 20px var(--glow-cyan);
  }
  .design-label span {
    display: block;
    font-size: 10px;
    font-weight: 400;
    color: var(--text-dim);
    margin-top: 3px;
  }
</style>
</head>
<body>

<div class="design-label">
  DESIGN 3 — NÉON CINÉMA
  <span>Cinematic void, cyan/magenta glow, bold sans-serif</span>
</div>

<nav class="nav">
  <div class="nav-logo">Frise Série</div>
  <div class="nav-eras">
    <button class="era-pill active">Antiquité</button>
    <button class="era-pill">Moyen Âge</button>
    <button class="era-pill">Renaissance</button>
    <button class="era-pill">Ép. Moderne</button>
    <button class="era-pill">Révolutions</button>
    <button class="era-pill">XIXe siècle</button>
    <button class="era-pill">Guerres</button>
    <button class="era-pill">Guerre froide</button>
    <button class="era-pill">Contemporain</button>
  </div>
  <div class="nav-actions">
    <button class="nav-btn">Filtres</button>
    <button class="locale-switch">FR</button>
  </div>
</nav>

<div class="timeline-viewport" id="viewport">
  <div class="timeline-canvas">

    <div class="era-bg-layer" id="bgLayer">
      <div class="era-bg" style="width:1200px; --era-color:#ff6b35; background: radial-gradient(ellipse at 50% 80%, rgba(255,107,53,0.06) 0%, transparent 60%);">
        <div class="era-bg-title">Antiquité</div>
      </div>
      <div class="era-bg" style="width:1400px; --era-color:#6366f1; background: radial-gradient(ellipse at 50% 80%, rgba(99,102,241,0.06) 0%, transparent 60%);">
        <div class="era-bg-title">Moyen Âge</div>
      </div>
      <div class="era-bg" style="width:800px; --era-color:#eab308; background: radial-gradient(ellipse at 50% 80%, rgba(234,179,8,0.06) 0%, transparent 60%);">
        <div class="era-bg-title">Renaissance</div>
      </div>
      <div class="era-bg" style="width:900px; --era-color:#14b8a6; background: radial-gradient(ellipse at 50% 80%, rgba(20,184,166,0.06) 0%, transparent 60%);">
        <div class="era-bg-title">Ép. Moderne</div>
      </div>
      <div class="era-bg" style="width:500px; --era-color:#ef4444; background: radial-gradient(ellipse at 50% 80%, rgba(239,68,68,0.06) 0%, transparent 60%);">
        <div class="era-bg-title">Révolutions</div>
      </div>
      <div class="era-bg" style="width:700px; --era-color:#64748b; background: radial-gradient(ellipse at 50% 80%, rgba(100,116,139,0.06) 0%, transparent 60%);">
        <div class="era-bg-title">XIXe Siècle</div>
      </div>
      <div class="era-bg" style="width:600px; --era-color:#dc2626; background: radial-gradient(ellipse at 50% 80%, rgba(220,38,38,0.04) 0%, transparent 60%);">
        <div class="era-bg-title">Guerres</div>
      </div>
      <div class="era-bg" style="width:800px; --era-color:#0ea5e9; background: radial-gradient(ellipse at 50% 80%, rgba(14,165,233,0.06) 0%, transparent 60%);">
        <div class="era-bg-title">Guerre Froide</div>
      </div>
      <div class="era-bg" style="width:1100px; --era-color:#00e5ff; background: radial-gradient(ellipse at 50% 80%, rgba(0,229,255,0.05) 0%, transparent 60%);">
        <div class="era-bg-title">Contemporain</div>
      </div>
    </div>

    <div class="axis-layer" id="axisLayer">
      <div class="axis-line"></div>
    </div>

    <div class="cards-layer" id="cardsLayer"></div>

  </div>
</div>

<div class="sheet-backdrop" id="backdrop"></div>
<div class="bottom-sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-content" id="sheetContent"></div>
</div>

<script>
const shows = [
  { title:"Spartacus", years:"73 av. J.-C.", stars:3, platform:"Prime Video", pos:200 },
  { title:"Rome", years:"52 – 44 av. J.-C.", stars:4, platform:"Max", pos:400 },
  { title:"Vikings", years:"793 – 1002", stars:4, platform:"Netflix", pos:1500 },
  { title:"The Last Kingdom", years:"866 – 950", stars:4, platform:"Netflix", pos:1700 },
  { title:"Knightfall", years:"1306 – 1314", stars:3, platform:"Netflix", pos:2100 },
  { title:"Marco Polo", years:"1271 – 1300", stars:3, platform:"Netflix", pos:1950 },
  { title:"Les Borgia", years:"1492 – 1507", stars:4, platform:"Canal+", pos:2700 },
  { title:"Les Tudors", years:"1509 – 1547", stars:4, platform:"Prime Video", pos:2900 },
  { title:"Reign", years:"1557 – 1567", stars:2, platform:"Netflix", pos:3100 },
  { title:"Versailles", years:"1667 – 1715", stars:4, platform:"Canal+", pos:3500 },
  { title:"Black Sails", years:"1715 – 1725", stars:4, platform:"Prime Video", pos:3800 },
  { title:"Turn", years:"1776 – 1783", stars:3, platform:"Prime Video", pos:4300 },
  { title:"Les Misérables", years:"1815 – 1832", stars:4, platform:"Arte", pos:4700 },
  { title:"Peaky Blinders", years:"1919 – 1934", stars:4, platform:"Netflix", pos:5200 },
  { title:"Band of Brothers", years:"1944", stars:5, platform:"Max", pos:5800 },
  { title:"Shogun", years:"1600", stars:5, platform:"Disney+", pos:3350 },
];

const events = [
  { label:"Début de l'Antiquité", pos:50 },
  { label:"Guerre des Gaules", pos:380 },
  { label:"Chute de Rome", pos:1200 },
  { label:"Conquête normande", pos:1850 },
  { label:"Chute de Constantinople", pos:2600 },
  { label:"Révolution française", pos:4200 },
  { label:"Début WWI", pos:5100 },
  { label:"Fin WWII", pos:5900 },
  { label:"Fin Guerre froide", pos:6700 },
];

const ticks = [];
for (let y = -3000; y <= 2025; y += 100) {
  ticks.push({ year: y, pos: Math.round(((y + 3000) / 5025) * 8000) });
}

const axisLayer = document.getElementById('axisLayer');
ticks.forEach(t => {
  const tick = document.createElement('div');
  tick.className = 'axis-tick';
  tick.style.left = t.pos + 'px';
  const label = t.year < 0 ? Math.abs(t.year) + ' av. J.-C.' : t.year.toString();
  tick.innerHTML = `<div class="axis-tick-mark"></div><div class="axis-tick-label">${label}</div>`;
  axisLayer.appendChild(tick);
});

events.forEach(e => {
  const ev = document.createElement('div');
  ev.className = 'axis-event';
  ev.style.left = e.pos + 'px';
  ev.innerHTML = `<div class="axis-event-pulse"></div><div class="axis-event-tooltip">${e.label}</div>`;
  axisLayer.appendChild(ev);
});

const cardsLayer = document.getElementById('cardsLayer');
const lanes = [];
shows.forEach((s, i) => {
  let lane = 0;
  for (let l = 0; l < lanes.length; l++) {
    if (s.pos - lanes[l] >= 156) { lane = l; break; }
    lane = l + 1;
  }
  lanes[lane] = s.pos;

  const card = document.createElement('div');
  card.className = 'show-card';
  card.style.left = s.pos + 'px';
  card.style.top = (lane * 285) + 'px';

  const starsStr = '★'.repeat(s.stars) + '☆'.repeat(5 - s.stars);
  card.innerHTML = `
    <div class="card-poster"><div class="card-poster-placeholder">${s.title[0]}</div></div>
    <div class="card-info">
      <div class="card-title">${s.title}</div>
      <div class="card-years">${s.years}</div>
      <div class="card-stars">${starsStr}</div>
      <span class="card-platform">${s.platform}</span>
    </div>
  `;
  card.addEventListener('click', () => openSheet(s));
  cardsLayer.appendChild(card);
});

const sheet = document.getElementById('sheet');
const backdrop = document.getElementById('backdrop');
const sheetContent = document.getElementById('sheetContent');

function openSheet(s) {
  const starsStr = '★'.repeat(s.stars) + '☆'.repeat(5 - s.stars);
  sheetContent.innerHTML = `
    <div class="sheet-poster">${s.title[0]}</div>
    <div class="sheet-details">
      <div class="sheet-title">${s.title}</div>
      <div class="sheet-meta">${s.years} · ${starsStr}<span class="era-tag">Fiabilité</span></div>
      <div class="sheet-synopsis">Synopsis historique de la série ${s.title}. Cette série explore les événements de l'époque avec un regard dramatique sur les personnages et les conflits qui ont marqué cette période de l'histoire.</div>
      <div class="sheet-platforms">
        <button class="sheet-platform-btn">▶ ${s.platform}</button>
        <button class="sheet-platform-btn magenta">Copier le lien</button>
        <button class="sheet-platform-btn">Wikipedia ↗</button>
      </div>
    </div>
  `;
  sheet.classList.add('open');
  backdrop.classList.add('visible');
}

backdrop.addEventListener('click', () => {
  sheet.classList.remove('open');
  backdrop.classList.remove('visible');
});

const viewport = document.getElementById('viewport');
const bgLayer = document.getElementById('bgLayer');
viewport.addEventListener('scroll', () => {
  bgLayer.style.transform = `translateX(${-viewport.scrollLeft * 0.3}px)`;
}, { passive: true });

viewport.addEventListener('wheel', (e) => {
  if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
    e.preventDefault();
    viewport.scrollLeft += e.deltaY;
  }
}, { passive: false });
</script>
</body>
</html>
